<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Decotara">
<title>Decotara Stock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --red:#C0001A;--red2:#9A0015;--red-bg:#FFF0F2;--red-border:#FFCCD3;
  --dark:#1A0A0C;--dark2:#2D1518;
  --bg:#FDF7F7;--bg2:#F5EAEB;--card:#FFFFFF;--border:#EDD5D8;--border2:#E0C0C4;
  --text:#1A0A0C;--muted:#8A5C62;
  --green:#1A6B3A;--green-bg:#E6F7ED;--green-border:#A8D9BA;
  --amber:#B86A00;--amber-bg:#FFF5E0;
  --r:14px;--rs:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:50px}
.hdr{background:linear-gradient(135deg,var(--dark2) 0%,var(--red2) 60%,var(--red) 100%);padding:0 18px;display:flex;align-items:stretch;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(192,0,26,.35)}
.logo-wrap{display:flex;align-items:center;gap:10px;padding:12px 0}
.logo-icon{width:42px;height:42px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.logo{font-size:19px;font-weight:700;color:#fff;line-height:1}
.logo span{color:rgba(255,200,205,.85);font-size:10px;font-weight:500;display:block;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.db-lbl{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,210,215,.9);font-weight:500;padding:12px 0}
.dot{width:7px;height:7px;border-radius:50%;background:#4DDB80;flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border)}
.tab{flex:1;padding:12px 0;text-align:center;font-size:13px;font-weight:600;color:var(--muted);border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:"DM Sans",sans-serif;transition:all .15s}
.tab.active{color:var(--red);border-bottom-color:var(--red);background:linear-gradient(to bottom,#fff,var(--red-bg))}
.wrap{padding:14px;max-width:680px;margin:0 auto}
.sec{display:none}.sec.active{display:block}
.alert{padding:11px 14px;border-radius:var(--rs);font-size:13px;margin-bottom:12px;display:none;font-weight:500}
.alert-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.alert-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--red)}
.mlbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.mval{font-size:24px;font-weight:700;color:var(--text);font-family:"DM Mono",monospace}
.mval.warn{color:var(--red)}
.cat-filter-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px}
.cfb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;font-family:"DM Sans",sans-serif;transition:all .15s;position:relative;border:none;outline:none}
.cfb.active{background:var(--red);box-shadow:0 3px 10px rgba(192,0,26,.3)}
.cfb-icon{font-size:22px;line-height:1}
.cfb-label{font-size:9px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.02em}
.cfb.active .cfb-label{color:#fff}
.cfb-count{position:absolute;top:5px;right:5px;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.cfb.active .cfb-count{background:rgba(255,255,255,.3)}
.cat-block{margin-bottom:20px}
.cat-hdr{margin-bottom:9px}
.cat-pill{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 12px;border-radius:20px;display:inline-block}
.prod-list{display:flex;flex-direction:column;gap:8px}
.prod-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:0 1px 4px rgba(192,0,26,.05)}
.prod-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px}
.prod-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.3;flex:1}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;margin-top:5px}
.b-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.b-low{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.b-zero{background:var(--amber-bg);color:var(--amber);border:1px solid #F5D88A}
.qty-ctrl{display:flex;align-items:center;gap:10px}
.qnum{font-size:30px;font-weight:700;font-family:"DM Mono",monospace;min-width:38px;text-align:center;line-height:1}
.qnum.ok{color:var(--green)}.qnum.low{color:var(--red)}.qnum.zero{color:var(--amber)}
.bq{width:40px;height:40px;border-radius:var(--rs);border:1.5px solid var(--border2);background:var(--bg2);cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;color:var(--red2);font-weight:700;transition:all .12s;user-select:none;flex-shrink:0}
.bq:active{background:var(--red);color:#fff;border-color:var(--red)}
.bq:disabled{opacity:.25;cursor:not-allowed}
.row-actions{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;font-size:16px}
.icon-btn:active{background:var(--red-bg)}
.btn-add-prod{width:100%;padding:14px;border:2px dashed var(--red-border);border-radius:var(--r);background:var(--red-bg);color:var(--red);font-size:14px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;margin-top:6px}
.btn-add-prod:active{background:var(--red);color:#fff}
.btn-add-linea{width:100%;padding:10px;border:1.5px dashed var(--red-border);border-radius:var(--rs);background:var(--red-bg);color:var(--red);font-size:13px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;transition:all .15s}
.btn-add-linea:active{background:var(--red);color:#fff}
.linea-item{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:9px 11px;margin-bottom:8px}
.linea-info{flex:1;min-width:0}
.linea-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linea-qty{font-size:12px;color:var(--muted);font-weight:500}
.linea-del{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:13px;flex-shrink:0}
.linea-del:active{background:var(--red-bg)}
.lineas-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 8px}
.lineas-list{margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.linea-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;display:flex;align-items:center;gap:10px}
.linea-info{flex:1;min-width:0}
.linea-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linea-meta{font-size:11px;color:var(--muted);margin-top:2px}
.linea-qty{font-size:18px;font-weight:700;font-family:"DM Mono",monospace;color:var(--red);min-width:28px;text-align:center}
.linea-del{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);flex-shrink:0}
.linea-del:active{background:var(--red-bg);color:var(--red)}
.btn-pdf{display:flex;align-items:center;gap:7px;padding:10px 16px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;white-space:nowrap;box-shadow:0 2px 8px rgba(192,0,26,.3)}
.toolbar{display:flex;justify-content:flex-end;margin-bottom:14px}
.tienda-banner{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(192,0,26,.25)}
.overlay{position:fixed;inset:0;background:rgba(26,10,12,.55);z-index:300;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:500px;padding:6px 18px 36px;animation:slideUp .22s ease}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:4px;margin:12px auto 18px}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--text)}
.mfield{margin-bottom:14px}
.mfield label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.mfield input,.mfield select{width:100%;padding:12px 13px;border-radius:var(--rs);border:1.5px solid var(--border);font-size:15px;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;-webkit-appearance:none}
.mfield input:focus,.mfield select:focus{outline:none;border-color:var(--red)}
.modal-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:20px}
.btn-cancel{padding:13px;border:1.5px solid var(--border2);border-radius:var(--rs);background:transparent;font-size:14px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;color:var(--muted)}
.btn-save{padding:13px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif}
.sale-form{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.form-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
.form-title::before{content:"";width:4px;height:20px;background:var(--red);border-radius:2px;display:inline-block}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fgroup label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.fgroup input,.fgroup select{width:100%;padding:10px 12px;border-radius:var(--rs);border:1.5px solid var(--border);font-size:14px;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;-webkit-appearance:none}
.fgroup input:focus,.fgroup select:focus{outline:none;border-color:var(--red)}
.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif}
.btn-primary:disabled{opacity:.5}
.prod-search-wrap{position:relative}
.prod-search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--rs);padding:9px 11px;transition:border-color .15s}
.prod-search-box:focus-within{border-color:var(--red);background:#fff}
.prod-search-box input{flex:1;border:none;background:transparent;font-size:14px;color:var(--text);font-family:"DM Sans",sans-serif;outline:none;min-width:0}
.prod-search-box input::placeholder{color:var(--muted)}
.prod-search-ico{font-size:15px;flex-shrink:0}
.prod-search-clr{width:22px;height:22px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;padding:0}
.prod-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(192,0,26,.15);z-index:150;max-height:260px;overflow-y:auto}
.pd-cat{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.1em;padding:8px 12px 4px;border-top:1px solid var(--border)}
.pd-cat:first-child{border-top:none}
.pd-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;cursor:pointer;gap:8px;background:transparent;border:none;width:100%;text-align:left;font-family:"DM Sans",sans-serif}
.pd-item:active{background:var(--red-bg)}
.pd-item.pd-disabled{opacity:.4;cursor:not-allowed}
.pd-name{font-size:14px;font-weight:500;color:var(--text);flex:1}
.pd-qty{font-size:15px;font-weight:700;font-family:"DM Mono",monospace}
.pd-qty.ok{color:var(--green)}.pd-qty.low{color:var(--red)}.pd-qty.zero{color:var(--amber)}
.pd-stock-row{display:flex;gap:6px;flex-shrink:0;align-items:center}
.pd-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;display:flex;align-items:center;gap:3px}
.pd-tag-a{background:#E3EFF9;color:#1A4F7A}
.pd-tag-t{background:var(--green-bg);color:var(--green)}
.pd-tag-n{background:var(--amber-bg);color:var(--amber)}
.pd-empty{padding:14px 12px;font-size:13px;color:var(--muted);text-align:center}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 14px;margin-bottom:12px}
.search-box:focus-within{border-color:var(--red)}
.search-box input{flex:1;border:none;background:transparent;font-size:15px;color:var(--text);font-family:"DM Sans",sans-serif;outline:none}
.search-box input::placeholder{color:var(--muted)}
.search-ico{font-size:17px;flex-shrink:0}
.venta-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.venta-top{background:linear-gradient(135deg,var(--dark2),var(--red2));padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.venta-client{font-size:15px;font-weight:700;color:#fff}
.venta-alb{font-family:"DM Mono",monospace;font-size:11px;background:rgba(255,255,255,.18);color:#fff;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;margin-top:4px}
.venta-date{font-size:11px;color:rgba(255,210,215,.85);font-weight:500;flex-shrink:0;background:rgba(0,0,0,.2);padding:3px 8px;border-radius:20px}
.venta-body{padding:12px 14px}
.venta-info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.venta-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-weight:500}
.venta-chip.qty{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;font-weight:700}
.venta-chip.origen{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.btn-del-venta{width:100%;padding:14px;border:none;border-radius:var(--rs);background:var(--red);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-del-venta:active{background:var(--red2)}
.origen-subtitle{font-size:14px;color:var(--text);margin-bottom:8px;line-height:1.4}
.origen-subtitle strong{color:var(--red)}
.origen-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:10px;text-align:left;font-family:"DM Sans",sans-serif}
.origen-btn:active{background:var(--red-bg);border-color:var(--red)}
.origen-icon{font-size:26px;flex-shrink:0}
.origen-info{flex:1}
.origen-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.origen-stock{font-size:13px;font-weight:500}
.origen-green{color:var(--green)}
.origen-arrow{font-size:20px;color:var(--red);font-weight:700}
.origen-ninguno{width:100%;padding:12px;border:1.5px dashed var(--border2);border-radius:var(--rs);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:"DM Sans",sans-serif;margin-top:4px}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
.loading{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:380px){.metrics{gap:6px}.mval{font-size:20px}.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo-wrap">
    <div class="logo-icon">🏠</div>
    <div class="logo">Decotara<span>Gestión de Stock</span></div>
  </div>
  <div class="db-lbl"><span class="dot"></span>En línea</div>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('stock',this)">📦 Almacén</button>
  <button class="tab" onclick="switchTab('tienda',this)">🏠 Tienda</button>
  <button class="tab" onclick="switchTab('ventas',this)">🛒 Ventas</button>
</div>
<div class="wrap">
  <div id="alert-box" class="alert"></div>
  <div id="sec-stock" class="sec active">
    <div class="toolbar">
      <button class="btn-pdf" onclick="exportPDF('almacen')">📄 PDF inventario</button>
    </div>
    <div id="stock-content"><div class="loading"><span class="spin"></span>Cargando...</div></div>
  </div>
  <div id="sec-tienda" class="sec">
    <div class="tienda-banner">🏠 Stock expuesto en tienda</div>
    <div class="toolbar">
      <button class="btn-pdf" onclick="exportPDF('tienda')">📄 PDF tienda</button>
    </div>
    <div id="tienda-content"><div class="loading"><span class="spin"></span>Cargando...</div></div>
  </div>
  <div id="sec-ventas" class="sec">
    <div class="sale-form">
      <div class="form-title">Registrar venta</div>
      <div class="fgrid">
        <div class="fgroup"><label>Cliente</label><input type="text" id="sale-client" placeholder="Nombre del cliente" autocomplete="off"></div>
        <div class="fgroup"><label>N. Albarán</label><input type="text" id="sale-albaran" placeholder="ALB-0001" autocomplete="off"></div>
        <div class="fgroup"><label>Fecha</label><input type="date" id="sale-date"></div>
        <div class="fgroup">
          <label>Artículo</label>
          <div class="prod-search-wrap" id="prod-search-wrap">
            <div class="prod-search-box">
              <span class="prod-search-ico">🔍</span>
              <input type="text" id="prod-search-input" placeholder="Buscar artículo..." autocomplete="off">
              <button class="prod-search-clr" id="prod-search-clr">✕</button>
            </div>
            <div class="prod-dropdown" id="prod-dropdown" style="display:none"></div>
          </div>
          <input type="hidden" id="sale-product">
        </div>
      </div>
      <div class="fgrid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
        <div class="fgroup"><label>Cantidad</label><input type="number" id="sale-qty" value="1" min="1" max="99"></div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn-add-linea" onclick="addSale()">＋ Añadir artículo al albarán</button>
        </div>
      </div>
      <div id="lineas-container"></div>
      <button class="btn-primary" id="sale-btn" onclick="confirmarVentaMulti()">Registrar venta</button>
    </div>
    <div class="toolbar">
      <button class="btn-pdf" onclick="exportPDF('ventas')">📄 PDF ventas</button>
    </div>
    <div class="search-box">
      <span class="search-ico">🔍</span>
      <input type="text" id="ventas-search" placeholder="Buscar cliente, albarán o artículo..." oninput="renderSales()">
    </div>
    <div id="ventas-list"><div class="loading"><span class="spin"></span>Cargando...</div></div>
  </div>
</div>

<script>
var SURL = 'https://uflikwunrowiygcrngrz.supabase.co';
var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmbGlrd3Vucm93aXlnY3JuZ3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDU4NzIsImV4cCI6MjA5NTMyMTg3Mn0.2l8epSukKpS1qMDMuxif3xspWIWx-EeN1D4iZlh1ZHA';
var sb = supabase.createClient(SURL, SKEY);

var stockData = [];
var salesData = [];
var tiendaData = [];
var editingA = null;
var editingT = null;
var activeCatA = 'Todos';
var activeCatT = 'Todos';
var pendingSale = null;
var pendingLinea = null;
var lineasVenta = [];

var CAT_ICONS = {'Sofás':'🛋️','Canapés':'🛏️','Colchones':'😴','Sillas':'🪑','Otros':'📦'};
var CATS = ['Todos','Sofás','Canapés','Colchones','Sillas'];
var CAT_EMOJIS = {'Todos':'🔲','Sofás':'🛋️','Canapés':'🛏️','Colchones':'😴','Sillas':'🪑'};

document.getElementById('sale-date').value = new Date().toISOString().split('T')[0];

// Buscador artículo
document.getElementById('prod-search-input').addEventListener('input', filterProdSearch);
document.getElementById('prod-search-input').addEventListener('focus', filterProdSearch);
document.getElementById('prod-search-clr').addEventListener('click', clearProdSearch);
document.addEventListener('click', function(e) {
  var wrap = document.getElementById('prod-search-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('prod-dropdown').style.display = 'none';
  }
});

function init() {
  Promise.all([
    sb.from('stock').select('*').order('cat').order('name'),
    sb.from('sales').select('*').order('created_at', {ascending: false}),
    sb.from('stock_tienda').select('*').order('cat').order('name')
  ]).then(function(results) {
    var rs = results[0], rv = results[1], rt = results[2];
    if (!rs.error) stockData = rs.data || [];
    if (!rv.error) salesData = rv.data || [];
    if (!rt.error) tiendaData = rt.data || [];
    renderStock();
    renderTienda();
    renderSales();
  }).catch(function(e) {
    document.getElementById('stock-content').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
  });
}

function qi(qty) {
  if (qty === 0) return {cls:'b-zero', lbl:'Sin stock', nc:'zero'};
  if (qty <= 2) return {cls:'b-low', lbl:'Stock bajo', nc:'low'};
  return {cls:'b-ok', lbl:'Disponible', nc:'ok'};
}

function buildCatBar(data, active, fn) {
  var html = '<div class="cat-filter-bar">';
  CATS.forEach(function(cat) {
    var n = cat === 'Todos' ? data.length : data.filter(function(p) { return p.cat === cat; }).length;
    var isActive = active === cat ? 'active' : '';
    var badge = n > 0 ? '<span class="cfb-count">' + n + '</span>' : '';
    html += '<button class="cfb ' + isActive + '" onclick="' + fn + '(\'' + cat + '\')">';
    html += '<span class="cfb-icon">' + CAT_EMOJIS[cat] + '</span>';
    html += '<span class="cfb-label">' + cat + '</span>';
    html += badge + '</button>';
  });
  html += '</div>';
  return html;
}

function buildProdHTML(prods, editFn, delFn, qtyFn) {
  if (!prods.length) return '<div class="empty">No hay artículos en esta categoría.</div>';
  var cats = {};
  prods.forEach(function(p) { if (!cats[p.cat]) cats[p.cat] = []; cats[p.cat].push(p); });
  var h = '';
  Object.keys(cats).forEach(function(cat) {
    var items = cats[cat];
    h += '<div class="cat-block"><div class="cat-hdr"><span class="cat-pill">' + (CAT_ICONS[cat] || '📦') + ' ' + cat + '</span></div><div class="prod-list">';
    items.forEach(function(p) {
      var b = qi(p.qty);
      var dis = p.qty === 0 ? ' disabled' : '';
      h += '<div class="prod-row">';
      h += '<div class="prod-top">';
      h += '<div><div class="prod-name">' + p.name + '</div><span class="badge ' + b.cls + '">' + b.lbl + '</span></div>';
      h += '<div class="row-actions">';
      h += '<button class="icon-btn" onclick="' + editFn + '(\'' + p.id + '\')">✏️</button>';
      h += '<button class="icon-btn" onclick="' + delFn + '(\'' + p.id + '\')">🗑️</button>';
      h += '</div></div>';
      h += '<div class="qty-ctrl">';
      h += '<button class="bq" onclick="' + qtyFn + '(\'' + p.id + '\',-1)"' + dis + '>−</button>';
      h += '<span class="qnum ' + b.nc + '">' + p.qty + '</span>';
      h += '<button class="bq" onclick="' + qtyFn + '(\'' + p.id + '\',1)">+</button>';
      h += '</div></div>';
    });
    h += '</div></div>';
  });
  return h;
}

function setCatA(cat) { activeCatA = cat; renderStock(); }
function setCatT(cat) { activeCatT = cat; renderTienda(); }

function renderStock() {
  var zero = stockData.filter(function(p) { return p.qty === 0; }).length;
  var filtered = activeCatA === 'Todos' ? stockData : stockData.filter(function(p) { return p.cat === activeCatA; });
  var h = '<div class="metrics">';
  h += '<div class="metric"><div class="mlbl">Ventas</div><div class="mval">' + salesData.length + '</div></div>';
  h += '<div class="metric"><div class="mlbl">Sin stock</div><div class="mval' + (zero > 0 ? ' warn' : '') + '">' + zero + '</div></div>';
  h += '</div>';
  h += buildCatBar(stockData, activeCatA, 'setCatA');
  h += stockData.length ? buildProdHTML(filtered, 'openEditA', 'deleteA', 'changeQtyA') : '<div class="empty">No hay artículos. Añade el primero.</div>';
  h += '<button class="btn-add-prod" onclick="openNewA()">＋ Añadir artículo</button>';
  document.getElementById('stock-content').innerHTML = h;
}

function renderTienda() {
  var total = tiendaData.reduce(function(s, p) { return s + p.qty; }, 0);
  var zero = tiendaData.filter(function(p) { return p.qty === 0; }).length;
  var filtered = activeCatT === 'Todos' ? tiendaData : tiendaData.filter(function(p) { return p.cat === activeCatT; });
  var h = '<div class="metrics">';
  h += '<div class="metric"><div class="mlbl">Expuestos</div><div class="mval">' + total + '</div></div>';
  h += '<div class="metric"><div class="mlbl">Sin exponer</div><div class="mval' + (zero > 0 ? ' warn' : '') + '">' + zero + '</div></div>';
  h += '</div>';
  h += buildCatBar(tiendaData, activeCatT, 'setCatT');
  h += tiendaData.length ? buildProdHTML(filtered, 'openEditT', 'deleteT', 'changeQtyT') : '<div class="empty">No hay artículos en tienda. Añade el primero.</div>';
  h += '<button class="btn-add-prod" onclick="openNewT()">＋ Añadir artículo</button>';
  document.getElementById('tienda-content').innerHTML = h;
}

// CRUD ALMACÉN
function changeQtyA(id, delta) {
  var p = stockData.find(function(x) { return x.id === id; });
  if (!p) return;
  var nv = p.qty + delta;
  if (nv < 0) { showAlert('No hay más stock.', 'err'); return; }
  p.qty = nv; renderStock();
  sb.from('stock').update({qty: nv}).eq('id', id).then(function(r) {
    if (r.error) { showAlert('Error al guardar: ' + r.error.message, 'err'); p.qty -= delta; renderStock(); }
  });
}
function openNewA() {
  editingA = null;
  document.getElementById('modal-a-title').textContent = 'Nuevo artículo';
  document.getElementById('modal-a-id').value = '';
  document.getElementById('modal-a-name').value = '';
  document.getElementById('modal-a-cat').value = 'Sofás';
  document.getElementById('modal-a-qty').value = '0';
  document.getElementById('modal-almacen').classList.add('open');
  setTimeout(function() { document.getElementById('modal-a-name').focus(); }, 300);
}
function openEditA(id) {
  var p = stockData.find(function(x) { return x.id === id; });
  if (!p) return;
  editingA = id;
  document.getElementById('modal-a-title').textContent = 'Editar artículo';
  document.getElementById('modal-a-id').value = p.id;
  document.getElementById('modal-a-name').value = p.name;
  document.getElementById('modal-a-cat').value = p.cat;
  document.getElementById('modal-a-qty').value = p.qty;
  document.getElementById('modal-almacen').classList.add('open');
}
function deleteA(id) {
  var p = stockData.find(function(x) { return x.id === id; });
  if (!p) return;
  if (!confirm('¿Eliminar "' + p.name + '"?')) return;
  sb.from('stock').delete().eq('id', id).then(function() {
    stockData = stockData.filter(function(x) { return x.id !== id; });
    renderStock(); showAlert('"' + p.name + '" eliminado.', 'ok');
  });
}

// CRUD TIENDA
function changeQtyT(id, delta) {
  var p = tiendaData.find(function(x) { return x.id === id; });
  if (!p) return;
  var nv = p.qty + delta;
  if (nv < 0) { showAlert('No hay más unidades.', 'err'); return; }
  p.qty = nv; renderTienda();
  sb.from('stock_tienda').update({qty: nv}).eq('id', id).then(function(r) {
    if (r.error) { showAlert('Error al guardar: ' + r.error.message, 'err'); p.qty -= delta; renderTienda(); }
  });
}
function openNewT() {
  editingT = null;
  document.getElementById('modal-t-title').textContent = 'Nuevo artículo en tienda';
  document.getElementById('modal-t-id').value = '';
  document.getElementById('modal-t-name').value = '';
  document.getElementById('modal-t-cat').value = 'Sofás';
  document.getElementById('modal-t-qty').value = '1';
  document.getElementById('modal-tienda').classList.add('open');
  setTimeout(function() { document.getElementById('modal-t-name').focus(); }, 300);
}
function openEditT(id) {
  var p = tiendaData.find(function(x) { return x.id === id; });
  if (!p) return;
  editingT = id;
  document.getElementById('modal-t-title').textContent = 'Editar artículo';
  document.getElementById('modal-t-id').value = p.id;
  document.getElementById('modal-t-name').value = p.name;
  document.getElementById('modal-t-cat').value = p.cat;
  document.getElementById('modal-t-qty').value = p.qty;
  document.getElementById('modal-tienda').classList.add('open');
}
function deleteT(id) {
  var p = tiendaData.find(function(x) { return x.id === id; });
  if (!p) return;
  if (!confirm('¿Eliminar "' + p.name + '" de tienda?')) return;
  sb.from('stock_tienda').delete().eq('id', id).then(function() {
    tiendaData = tiendaData.filter(function(x) { return x.id !== id; });
    renderTienda(); showAlert('"' + p.name + '" eliminado de tienda.', 'ok');
  });
}

function saveProduct(tipo) {
  var prefix = tipo === 'almacen' ? 'modal-a' : 'modal-t';
  var tabla = tipo === 'almacen' ? 'stock' : 'stock_tienda';
  var editingId = tipo === 'almacen' ? editingA : editingT;
  var name = document.getElementById(prefix + '-name').value.trim();
  var cat = document.getElementById(prefix + '-cat').value;
  var qty = parseInt(document.getElementById(prefix + '-qty').value) || 0;
  if (!name) { showAlert('Escribe el nombre del artículo.', 'err'); return; }
  var modalId = tipo === 'almacen' ? 'modal-almacen' : 'modal-tienda';
  if (editingId) {
    sb.from(tabla).update({name: name, cat: cat, qty: qty}).eq('id', editingId).then(function() {
      var arr = tipo === 'almacen' ? stockData : tiendaData;
      var p = arr.find(function(x) { return x.id === editingId; });
      if (p) { p.name = name; p.cat = cat; p.qty = qty; }
      closeModal(modalId);
      if (tipo === 'almacen') renderStock(); else renderTienda();
      showAlert('"' + name + '" actualizado.', 'ok');
    });
  } else {
    var id = (tipo === 'almacen' ? 'a' : 't') + '_' + Date.now();
    sb.from(tabla).insert([{id: id, name: name, cat: cat, qty: qty}]).then(function() {
      if (tipo === 'almacen') { stockData.push({id: id, name: name, cat: cat, qty: qty}); stockData.sort(function(a,b){return a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name);}); }
      else { tiendaData.push({id: id, name: name, cat: cat, qty: qty}); tiendaData.sort(function(a,b){return a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name);}); }
      closeModal(modalId);
      if (tipo === 'almacen') renderStock(); else renderTienda();
      showAlert('"' + name + '" añadido.', 'ok');
    });
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  editingA = null; editingT = null;
}

// BUSCADOR
function filterProdSearch() {
  var q = (document.getElementById('prod-search-input').value || '').toLowerCase().trim();
  var dd = document.getElementById('prod-dropdown');
  var clr = document.getElementById('prod-search-clr');
  clr.style.display = q ? 'flex' : 'none';

  // Combinar almacen y tienda por nombre
  var allNames = {};
  stockData.forEach(function(p) {
    var key = p.name.toLowerCase();
    if (!allNames[key]) allNames[key] = {name:p.name, cat:p.cat, almacen:null, tienda:null};
    allNames[key].almacen = p;
  });
  tiendaData.forEach(function(t) {
    var key = t.name.toLowerCase();
    if (!allNames[key]) allNames[key] = {name:t.name, cat:t.cat, almacen:null, tienda:null};
    allNames[key].tienda = t;
  });

  var items = Object.values(allNames);
  var matches = q ? items.filter(function(i) {
    return i.name.toLowerCase().indexOf(q) >= 0 || i.cat.toLowerCase().indexOf(q) >= 0;
  }) : items;

  if (!matches.length) { dd.innerHTML = '<div class="pd-empty">No se encontro ningun articulo</div>'; dd.style.display = 'block'; return; }

  var cats = {};
  matches.forEach(function(i) { if (!cats[i.cat]) cats[i.cat] = []; cats[i.cat].push(i); });

  var h = '';
  Object.keys(cats).forEach(function(cat) {
    h += '<div class="pd-cat">' + (CAT_ICONS[cat] || '📦') + ' ' + cat + '</div>';
    cats[cat].forEach(function(item) {
      var qa = item.almacen ? item.almacen.qty : 0;
      var qt = item.tienda ? item.tienda.qty : 0;
      var disponible = qa > 0 || qt > 0;
      var dis = !disponible ? ' pd-disabled' : '';
      var pid = item.almacen ? item.almacen.id : (item.tienda ? item.tienda.id : '');
      var safeName = item.name.replace(/'/g, "APOS");
      var onclick = disponible ? ' onclick="selectProd(\'' + pid + '\',\'' + safeName + '\')"' : '';
      var tags = '';
      if (item.almacen !== null) {
        var ca = qa === 0 ? 'pd-tag-n' : 'pd-tag-a';
        tags += '<span class="pd-tag ' + ca + '">🏭 ' + qa + ' ud.</span>';
      }
      if (item.tienda !== null) {
        var ct = qt === 0 ? 'pd-tag-n' : 'pd-tag-t';
        tags += '<span class="pd-tag ' + ct + '">🏠 ' + qt + ' ud.</span>';
      }
      h += '<button class="pd-item' + dis + '"' + onclick + '>';
      h += '<span class="pd-name">' + item.name + '</span>';
      h += '<div class="pd-stock-row">' + tags + '</div>';
      h += '</button>';
    });
  });
  dd.innerHTML = h; dd.style.display = 'block';
}
function selectProd(id, name) {
  document.getElementById('sale-product').value = id;
  document.getElementById('prod-search-input').value = name.replace(/APOS/g, "'");
  document.getElementById('prod-search-clr').style.display = 'flex';
  document.getElementById('prod-dropdown').style.display = 'none';
}
function clearProdSearch() {
  document.getElementById('sale-product').value = '';
  document.getElementById('prod-search-input').value = '';
  document.getElementById('prod-search-clr').style.display = 'none';
  document.getElementById('prod-dropdown').style.display = 'none';
  document.getElementById('prod-search-input').focus();
}

// VENTAS
function renderSales() {
  var el = document.getElementById('ventas-list');
  var q = (document.getElementById('ventas-search').value || '').toLowerCase().trim();
  var filtered = q ? salesData.filter(function(s) {
    return (s.client||'').toLowerCase().indexOf(q) >= 0 ||
           (s.albaran||'').toLowerCase().indexOf(q) >= 0 ||
           (s.product||'').toLowerCase().indexOf(q) >= 0;
  }) : salesData;
  if (!salesData.length) { el.innerHTML = '<div class="empty">No hay ventas todavía.</div>'; return; }
  if (!filtered.length) { el.innerHTML = '<div class="empty">Sin resultados para "' + q + '".</div>'; return; }
  var h = '';
  filtered.forEach(function(s) {
    var d = s.date ? s.date.split('-').reverse().join('/') : '';
    h += '<div class="venta-card">';
    h += '<div class="venta-top">';
    h += '<div><div class="venta-client">' + (s.client||'') + '</div><span class="venta-alb">' + (s.albaran||'') + '</span></div>';
    h += '<span class="venta-date">' + d + '</span>';
    h += '</div><div class="venta-body"><div class="venta-info">';
    h += '<span class="venta-chip">' + (s.product||'') + '</span>';
    h += '<span class="venta-chip qty">' + s.qty + ' ud.</span>';
    if (s.origen) h += '<span class="venta-chip origen">' + s.origen + '</span>';
    h += '</div>';
    h += '<button class="btn-del-venta" onclick="deleteSale(' + s.id + ')">🗑️ Eliminar venta entregada</button>';
    h += '</div></div>';
  });
  el.innerHTML = h;
}

function deleteSale(id) {
  if (!confirm('¿Eliminar esta venta?\nEl stock NO se modificará.')) return;
  sb.from('sales').delete().eq('id', id).then(function() {
    salesData = salesData.filter(function(s) { return s.id !== id; });
    renderSales(); renderStock(); showAlert('Venta eliminada.', 'ok');
  });
}

function addSale() {
  var pid = document.getElementById('sale-product').value;
  var qty = parseInt(document.getElementById('sale-qty').value) || 1;
  if (!pid) { showAlert('Selecciona un articulo.', 'err'); return; }

  var p = stockData.find(function(x) { return x.id === pid; });
  var tm = null;
  if (p) {
    tm = tiendaData.find(function(t) { return t.name.toLowerCase() === p.name.toLowerCase(); });
  } else {
    var tItem = tiendaData.find(function(t) { return t.id === pid; });
    if (tItem) {
      tm = tItem;
      p = stockData.find(function(x) { return x.name.toLowerCase() === tItem.name.toLowerCase(); });
      if (!p) p = {id: tItem.id, name: tItem.name, cat: tItem.cat, qty: 0};
    }
  }
  if (!p) { showAlert('Articulo no valido.', 'err'); return; }

  var qa = p.qty || 0;
  var qt = tm ? tm.qty : 0;
  if (qa < qty && qt < qty) {
    showAlert('Stock insuficiente — Almacen: ' + qa + ' ud. / Tienda: ' + qt + ' ud.', 'err');
    return;
  }

  if (qa >= qty && qt >= qty) {
    pendingLinea = {p:p, tm:tm, qty:qty};
    openOrigenModal(p, tm, qty);
    return;
  }
  var origen = qa >= qty ? 'almacen' : 'tienda';
  agregarLinea(p, tm, qty, origen);
}

function openOrigenModal(p, tm, qty) {
  var h = '<div class="origen-subtitle">Articulo <strong>' + qty + ' x ' + p.name + '</strong></div>';
  h += '<div class="origen-subtitle" style="margin-bottom:16px">Hay stock en los dos sitios. De donde se descuenta?</div>';
  h += '<button class="origen-btn" onclick="confirmarOrigenLinea(\'almacen\')">';
  h += '<span class="origen-icon">🏭</span><div class="origen-info"><div class="origen-name">Stock Almacen</div><div class="origen-stock origen-green">' + p.qty + ' ud. disponibles</div></div>';
  h += '<span class="origen-arrow">→</span></button>';
  h += '<button class="origen-btn" onclick="confirmarOrigenLinea(\'tienda\')">';
  h += '<span class="origen-icon">🏠</span><div class="origen-info"><div class="origen-name">Stock Tienda</div><div class="origen-stock origen-green">' + tm.qty + ' ud. disponibles</div></div>';
  h += '<span class="origen-arrow">→</span></button>';
  document.getElementById('origen-body').innerHTML = h;
  document.getElementById('modal-origen').classList.add('open');
}

function confirmarOrigenLinea(origen) {
  document.getElementById('modal-origen').classList.remove('open');
  var l = pendingLinea;
  agregarLinea(l.p, l.tm, l.qty, origen);
  pendingLinea = null;
}

function agregarLinea(p, tm, qty, origen) {
  lineasVenta.push({
    id: 'L' + Date.now() + Math.floor(Math.random()*1000),
    productId: p.id,
    tiendaId: tm ? tm.id : null,
    name: p.name,
    qty: qty,
    origen: origen
  });
  document.getElementById('sale-product').value = '';
  document.getElementById('prod-search-input').value = '';
  document.getElementById('sale-qty').value = '1';
  clearProdSearch();
  renderLineas();
  showAlert(qty + ' x ' + p.name + ' anadido al albaran.', 'ok');
}

function renderLineas() {
  var cont = document.getElementById('lineas-container');
  if (!lineasVenta.length) { cont.innerHTML = ''; return; }
  var h = '<div class="lineas-title">Articulos en este albaran (' + lineasVenta.length + ')</div>';
  lineasVenta.forEach(function(l) {
    var origenIco = l.origen === 'almacen' ? '🏭' : '🏠';
    h += '<div class="linea-item">';
    h += '<div class="linea-info"><div class="linea-name">' + origenIco + ' ' + l.name + '</div><div class="linea-qty">' + l.qty + ' unidades</div></div>';
    h += '<button class="linea-del" onclick="quitarLinea(\'' + l.id + '\')">✕</button>';
    h += '</div>';
  });
  cont.innerHTML = h;
}

function quitarLinea(id) {
  lineasVenta = lineasVenta.filter(function(l) { return l.id !== id; });
  renderLineas();
}

function confirmarVentaMulti() {
  var client = (document.getElementById('sale-client').value || '').trim();
  var albaran = (document.getElementById('sale-albaran').value || '').trim();
  var date = document.getElementById('sale-date').value;

  if (!client) { showAlert('Indica el nombre del cliente.', 'err'); return; }
  if (!albaran) { showAlert('Introduce el numero de albaran.', 'err'); return; }
  if (!date) { showAlert('Selecciona la fecha.', 'err'); return; }

  // Si hay un articulo en el buscador sin anadir, lo anadimos primero
  var pid = document.getElementById('sale-product').value;
  if (pid && lineasVenta.length === 0) {
    addSale();
    setTimeout(confirmarVentaMulti, 50);
    return;
  }

  if (!lineasVenta.length) { showAlert('Anade al menos un articulo al albaran.', 'err'); return; }

  var btn = document.getElementById('sale-btn');
  btn.disabled = true; btn.textContent = 'Guardando...';

  var rows = lineasVenta.map(function(l) {
    var origenLabel = l.origen === 'almacen' ? 'Almacen' : 'Tienda';
    return {date:date, albaran:albaran, client:client, product:l.name, product_id:l.productId, qty:l.qty, origen:origenLabel};
  });

  sb.from('sales').insert(rows).select().then(function(result) {
    if (result.error) {
      showAlert('Error al registrar: ' + result.error.message, 'err');
      btn.disabled = false; btn.textContent = 'Registrar venta';
      return;
    }
    // Descontar stock de cada linea
    lineasVenta.forEach(function(l) {
      if (l.origen === 'almacen') {
        var p = stockData.find(function(x) { return x.id === l.productId; });
        if (p) {
          var nq = p.qty - l.qty;
          sb.from('stock').update({qty:nq}).eq('id',p.id).then(function(r){
            if(r.error) showAlert('Error actualizando stock de ' + p.name,'err');
          });
          p.qty = nq;
        }
      } else if (l.origen === 'tienda' && l.tiendaId) {
        var t = tiendaData.find(function(x) { return x.id === l.tiendaId; });
        if (t) {
          var nq2 = t.qty - l.qty;
          sb.from('stock_tienda').update({qty:nq2}).eq('id',t.id).then(function(r){
            if(r.error) showAlert('Error actualizando tienda de ' + t.name,'err');
          });
          t.qty = nq2;
        }
      }
    });
    salesData = result.data.concat(salesData);
    var totalArticulos = lineasVenta.length;
    var totalUds = lineasVenta.reduce(function(s,l){return s+l.qty;},0);
    lineasVenta = [];
    document.getElementById('sale-client').value = '';
    document.getElementById('sale-albaran').value = '';
    document.getElementById('sale-qty').value = '1';
    document.getElementById('sale-date').value = new Date().toISOString().split('T')[0];
    renderLineas();
    renderSales(); renderStock(); renderTienda();
    btn.disabled = false; btn.textContent = 'Registrar venta';
    showAlert('Albaran ' + albaran + ' registrado — ' + totalArticulos + ' articulo(s), ' + totalUds + ' unidades para ' + client + '.', 'ok');
  });
}

// PDF
function exportPDF(tipo) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
  var now = new Date();
  var fd = now.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'});
  var fh = now.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  var W = 210, M = 18, y = 50;

  doc.setFillColor(100,0,10); doc.rect(0,0,W,48,'F');
  doc.setFillColor(192,0,26); doc.rect(0,14,W,34,'F');
  doc.setDrawColor(255,255,255); doc.setLineWidth(0.4); doc.line(M,44,W-M,44);
  doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(255,255,255);
  doc.text('Decotara',M,20);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(255,200,205);
  doc.text('OUTLET',M+doc.getTextWidth('Decotara')+3,20);

  var data, titulo;
  if (tipo === 'almacen') { data = stockData; titulo = 'INFORME DE INVENTARIO'; }
  else if (tipo === 'tienda') { data = tiendaData; titulo = 'STOCK TIENDA'; }
  else { data = salesData; titulo = 'INFORME DE VENTAS'; }

  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(255,200,205);
  doc.text(titulo, M, 28);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(255,235,237);
  doc.text('Generado el ' + fd + ' a las ' + fh, M, 35);

  if (tipo === 'ventas') {
    if (!salesData.length) { showAlert('No hay ventas para exportar.', 'err'); return; }
    var totalUds = salesData.reduce(function(s,v){return s+v.qty;},0);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(salesData.length + ' ventas  ·  ' + totalUds + ' uds.', W-M, 28, {align:'right'});
    // Cabecera tabla
    doc.setFillColor(255,240,242); doc.roundedRect(M,y-5,W-M*2,10,2,2,'F');
    doc.setFillColor(192,0,26); doc.rect(M,y-5,3,10,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(140,0,18);
    doc.text('FECHA',M+7,y); doc.text('ALBARÁN',M+33,y);
    doc.text('CLIENTE',M+68,y); doc.text('ARTÍCULO',M+112,y); doc.text('UD.',W-M-2,y,{align:'right'});
    y += 5; doc.setDrawColor(192,0,26); doc.line(M,y,W-M,y); y += 5;
    salesData.forEach(function(s,i) {
      if (y > 274) { doc.addPage(); y = 20; }
      if (i%2===0) { doc.setFillColor(255,245,247); doc.rect(M,y-3.5,W-M*2,9,'F'); }
      var d = s.date ? s.date.split('-').reverse().join('/') : '';
      doc.setFillColor(192,0,26); doc.circle(M+3,y,1.2,'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(28,26,23);
      doc.text(d,M+7,y+0.5);
      var aw = Math.min(doc.getTextWidth(s.albaran||'')+6, 34);
      doc.setFillColor(255,225,230); doc.roundedRect(M+30,y-3,aw,5.5,1.5,1.5,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(192,0,26);
      doc.text((s.albaran||'').substring(0,12),M+33,y+0.8);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(28,26,23);
      var cl = (s.client||'').length>17?(s.client||'').substring(0,16)+'.':s.client||'';
      var pr = (s.product||'').length>20?(s.product||'').substring(0,19)+'.':s.product||'';
      doc.text(cl,M+68,y+0.5); doc.text(pr,M+112,y+0.5);
      doc.setFillColor(192,0,26); doc.circle(W-M-5,y,4,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
      doc.text(String(s.qty),W-M-5,y+0.8,{align:'center'});
      y += 9.5;
    });
  } else {
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
    doc.text(data.length + ' artículos', W-M, 28, {align:'right'});
    var cats = {};
    data.forEach(function(p) { if (!cats[p.cat]) cats[p.cat] = []; cats[p.cat].push(p); });
    Object.keys(cats).forEach(function(cat) {
      var prods = cats[cat];
      if (y > 260) { doc.addPage(); y = 20; }
      doc.setFillColor(255,240,242); doc.roundedRect(M,y-6,W-M*2,11,2,2,'F');
      doc.setFillColor(192,0,26); doc.rect(M,y-6,3,11,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(140,0,18);
      doc.text(cat.toUpperCase(),M+7,y+1.5); y += 14;
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(150,0,20);
      doc.text('ARTÍCULO',M+2,y); doc.text('ESTADO',W-M-50,y); doc.text('UNIDADES',W-M-2,y,{align:'right'});
      y += 1.5; doc.setDrawColor(192,0,26); doc.line(M,y,W-M,y); y += 4.5;
      prods.forEach(function(p,i) {
        if (y > 272) { doc.addPage(); y = 20; }
        if (i%2===0) { doc.setFillColor(255,245,247); doc.rect(M,y-3.5,W-M*2,8,'F'); }
        var tc = p.qty===0?[170,40,40]:p.qty<=2?[160,80,20]:[35,110,55];
        var pc = p.qty===0?[220,80,80]:p.qty<=2?[220,140,40]:[70,170,100];
        doc.setFillColor(pc[0],pc[1],pc[2]); doc.circle(M+3,y,1.2,'F');
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(28,26,23);
        doc.text(p.name,M+7,y+0.5);
        var bt = p.qty===0?'Sin stock':p.qty<=2?'Stock bajo':'Disponible';
        doc.setFillColor(Math.min(255,tc[0]+180),Math.min(255,tc[1]+180),Math.min(255,tc[2]+180));
        doc.roundedRect(W-M-52,y-3,32,5.5,1.5,1.5,'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(tc[0],tc[1],tc[2]);
        doc.text(bt,W-M-36,y+0.8,{align:'center'});
        doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(tc[0],tc[1],tc[2]);
        doc.text(String(p.qty),W-M-2,y+1,{align:'right'});
        y += 9;
      });
      y += 5;
    });
  }

  doc.setFillColor(100,0,10); doc.rect(0,284,W,14,'F');
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(255,200,205);
  doc.text('Decotara Stock · ' + titulo + ' ' + fd, M, 291);
  doc.text(fd + ' ' + fh, W-M, 291, {align:'right'});
  doc.save(tipo + '-decotara-' + now.toISOString().split('T')[0] + '.pdf');
  showAlert('PDF descargado.', 'ok');
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.sec').forEach(function(s) { s.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('sec-' + tab).classList.add('active');
}

function showAlert(msg, type) {
  var el = document.getElementById('alert-box');
  el.textContent = msg;
  el.className = 'alert alert-' + (type === 'err' ? 'err' : 'ok');
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.display = 'none'; }, 4500);
}

init();
</script>
