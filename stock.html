<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Decotara">
  <title>Decotara Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{
      --red:#C0001A;--red2:#9A0015;--red-bg:#FFF0F2;--red-border:#FFCCD3;
      --dark:#1A0A0C;--dark2:#2D1518;
      --bg:#FDF7F7;--bg2:#F5EAEB;--card:#FFFFFF;--border:#EDD5D8;--border2:#E0C0C4;
      --text:#1A0A0C;--muted:#8A5C62;
      --green:#1A6B3A;--green-bg:#E6F7ED;--green-border:#A8D9BA;
      --amber:#B86A00;--amber-bg:#FFF5E0;
      --r:14px;--rs:9px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:50px}
    .hdr{background:linear-gradient(135deg,var(--dark2) 0%,var(--red2) 60%,var(--red) 100%);padding:0 18px;display:flex;align-items:stretch;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(192,0,26,.35)}
    .logo-wrap{display:flex;align-items:center;gap:10px;padding:12px 0}
    .logo{font-family:"Playfair Display",serif;font-size:19px;color:#fff;line-height:1}
    .logo span{color:rgba(255,200,205,.85);font-size:10px;font-family:"DM Sans",sans-serif;font-weight:500;display:block;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
    .db-lbl{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,210,215,.9);font-weight:500;padding:12px 0}
    .dot{width:7px;height:7px;border-radius:50%;background:#4DDB80;flex-shrink:0;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border)}
    .tab{flex:1;padding:12px 0;text-align:center;font-size:13px;font-weight:600;color:var(--muted);border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:"DM Sans",sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
    .tab.active{color:var(--red);border-bottom-color:var(--red);background:linear-gradient(to bottom,#fff,var(--red-bg))}
    .tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wrap{padding:14px;max-width:680px;margin:0 auto}
    .sec{display:none}.sec.active{display:block}
    .alert{padding:11px 14px;border-radius:var(--rs);font-size:13px;margin-bottom:12px;display:none;font-weight:500}
    .alert-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
    .alert-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .metric{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;position:relative;overflow:hidden}
    .metric::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--red)}
    .mlbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
    .mval{font-size:24px;font-weight:700;color:var(--text);font-family:"DM Mono",monospace}
    .mval.warn{color:var(--red)}
    /* BARRA CATEGORÍAS */
    .cat-filter-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px}
    .cat-filter-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;font-family:"DM Sans",sans-serif;transition:all .15s;position:relative}
    .cat-filter-btn.active{background:var(--red);border-color:var(--red);box-shadow:0 3px 10px rgba(192,0,26,.3)}
    .cat-filter-btn svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
    .cat-filter-btn.active svg{stroke:#fff}
    .cat-filter-btn span{font-size:9px;font-weight:700;color:var(--muted);text-align:center;transition:color .15s;letter-spacing:.02em}
    .cat-filter-btn.active span{color:#fff}
    .cat-filter-count{position:absolute;top:5px;right:5px;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
    .cat-filter-btn.active .cat-filter-count{background:rgba(255,255,255,.3)}
    /* PRODUCTOS */
    .cat-block{margin-bottom:20px}
    .cat-hdr{margin-bottom:9px}
    .cat-pill{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
    .prod-list{display:flex;flex-direction:column;gap:8px}
    .prod-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:0 1px 4px rgba(192,0,26,.05)}
    .prod-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px}
    .prod-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.3;flex:1}
    .badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;margin-top:5px}
    .b-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
    .b-low{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
    .b-zero{background:var(--amber-bg);color:var(--amber);border:1px solid #F5D88A}
    .prod-bottom{display:flex;align-items:center}
    .qty-ctrl{display:flex;align-items:center;gap:10px}
    .qnum{font-size:30px;font-weight:700;font-family:"DM Mono",monospace;min-width:38px;text-align:center;line-height:1}
    .qnum.ok{color:var(--green)}.qnum.low{color:var(--red)}.qnum.zero{color:var(--amber)}
    .bq{width:40px;height:40px;border-radius:var(--rs);border:1.5px solid var(--border2);background:var(--bg2);cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;color:var(--red2);font-weight:700;transition:all .12s;user-select:none;flex-shrink:0}
    .bq:active{background:var(--red);color:#fff;border-color:var(--red)}
    .bq:disabled{opacity:.25;cursor:not-allowed}
    .row-actions{display:flex;gap:6px}
    .icon-btn{width:38px;height:38px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
    .icon-btn svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .icon-btn.edit:active{background:var(--red-bg);border-color:var(--red-border)}
    .icon-btn.edit:active svg{stroke:var(--red)}
    .icon-btn.del:active{background:var(--dark);border-color:var(--dark)}
    .icon-btn.del:active svg{stroke:#fff}
    .btn-add-prod{width:100%;padding:14px;border:2px dashed var(--red-border);border-radius:var(--r);background:var(--red-bg);color:var(--red);font-size:14px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;margin-top:6px}
    .btn-add-prod:active{background:var(--red);color:#fff;border-color:var(--red)}
    /* TOOLBAR / PDF */
    .btn-pdf{display:flex;align-items:center;gap:7px;padding:10px 16px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;white-space:nowrap;box-shadow:0 2px 8px rgba(192,0,26,.3)}
    .btn-pdf svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .toolbar{display:flex;justify-content:flex-end;margin-bottom:14px}
    /* MODAL */
    .overlay{position:fixed;inset:0;background:rgba(26,10,12,.55);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
    .overlay.open{display:flex}
    .modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:500px;padding:6px 18px 36px;animation:slideUp .22s ease}
    .modal-handle{width:40px;height:4px;background:var(--border2);border-radius:4px;margin:12px auto 18px}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-title{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--text)}
    .mfield{margin-bottom:14px}
    .mfield label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
    .mfield input,.mfield select{width:100%;padding:12px 13px;border-radius:var(--rs);border:1.5px solid var(--border);font-size:15px;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;-webkit-appearance:none;transition:border-color .15s}
    .mfield input:focus,.mfield select:focus{outline:none;border-color:var(--red);background:#fff}
    .modal-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:20px}
    .btn-cancel{padding:13px;border:1.5px solid var(--border2);border-radius:var(--rs);background:transparent;font-size:14px;font-weight:600;cursor:pointer;font-family:"DM Sans",sans-serif;color:var(--muted)}
    .btn-save{padding:13px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif}
    /* TIENDA BANNER */
    .tienda-banner{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(192,0,26,.25)}
    .tienda-banner svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    /* SALE FORM */
    .sale-form{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(192,0,26,.05)}
    .form-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
    .form-title::before{content:"";width:4px;height:20px;background:var(--red);border-radius:2px;display:inline-block}
    .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .fgroup label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
    .fgroup input,.fgroup select{width:100%;padding:10px 12px;border-radius:var(--rs);border:1.5px solid var(--border);font-size:14px;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;-webkit-appearance:none;transition:border-color .15s}
    .fgroup input:focus,.fgroup select:focus{outline:none;border-color:var(--red);background:#fff}
    .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif;box-shadow:0 2px 8px rgba(192,0,26,.3)}
    .btn-primary:disabled{opacity:.5}
    /* BUSCADOR PRODUCTO */
    .prod-search-wrap{position:relative}
    .prod-search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--rs);padding:9px 11px;transition:border-color .15s}
    .prod-search-box:focus-within{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(192,0,26,.1)}
    .prod-search-box svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex-shrink:0}
    .prod-search-box input{flex:1;border:none;background:transparent;font-size:14px;color:var(--text);font-family:"DM Sans",sans-serif;outline:none;min-width:0}
    .prod-search-box input::placeholder{color:var(--muted)}
    #prod-search-clear{width:22px;height:22px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0;padding:0}
    #prod-search-clear svg{width:11px;height:11px;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
    .prod-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgba(192,0,26,.15);z-index:150;max-height:260px;overflow-y:auto}
    .pd-cat{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.1em;padding:8px 12px 4px;border-top:1px solid var(--border)}
    .pd-cat:first-child{border-top:none}
    .pd-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;cursor:pointer;gap:8px;transition:background .1s}
    .pd-item:active,.pd-item:hover{background:var(--red-bg)}
    .pd-item.pd-disabled{opacity:.4;cursor:not-allowed}
    .pd-item.pd-disabled:active{background:transparent}
    .pd-name{font-size:14px;font-weight:500;color:var(--text);flex:1;min-width:0}
    .pd-name mark{background:rgba(192,0,26,.15);color:var(--red);border-radius:2px;padding:0 1px;font-weight:700}
    .pd-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .pd-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
    .pd-badge.pd-low{background:var(--red-bg);color:var(--red)}
    .pd-badge.pd-zero{background:var(--amber-bg);color:var(--amber)}
    .pd-qty{font-size:15px;font-weight:700;font-family:"DM Mono",monospace;min-width:24px;text-align:right}
    .pd-qty.pd-ok{color:var(--green)}.pd-qty.pd-low{color:var(--red)}.pd-qty.pd-zero{color:var(--amber)}
    .pd-empty{padding:14px 12px;font-size:13px;color:var(--muted);text-align:center}
    /* BÚSQUEDA VENTAS */
    .search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 14px;margin-bottom:12px;transition:border-color .15s}
    .search-box:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,0,26,.1)}
    .search-box svg{width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex-shrink:0}
    .search-box input{flex:1;border:none;background:transparent;font-size:15px;color:var(--text);font-family:"DM Sans",sans-serif;outline:none}
    .search-box input::placeholder{color:var(--muted)}
    #search-clear{width:26px;height:26px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;display:none;align-items:center;justify-content:center;flex-shrink:0}
    #search-clear svg{width:13px;height:13px;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
    .search-count{font-size:12px;color:var(--muted);margin-bottom:10px;padding:0 2px}
    .search-count strong{color:var(--red)}
    mark{background:rgba(192,0,26,.15);color:var(--red);border-radius:2px;padding:0 1px;font-weight:600}
    /* VENTA CARDS */
    .venta-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(192,0,26,.05)}
    .venta-card-top{background:linear-gradient(135deg,var(--dark2),var(--red2));padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .venta-client{font-size:15px;font-weight:700;color:#fff}
    .venta-alb{font-family:"DM Mono",monospace;font-size:11px;background:rgba(255,255,255,.18);color:#fff;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;margin-top:4px;letter-spacing:.04em}
    .venta-date{font-size:11px;color:rgba(255,210,215,.85);font-weight:500;flex-shrink:0;background:rgba(0,0,0,.2);padding:3px 8px;border-radius:20px}
    .venta-body{padding:12px 14px}
    .venta-info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .venta-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-weight:500}
    .venta-chip.qty{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;font-weight:700}
    .venta-chip.origen{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
    .btn-del-venta{width:100%;padding:14px;border:none;border-radius:var(--rs);background:var(--red);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.02em;box-shadow:0 2px 6px rgba(192,0,26,.3)}
    .btn-del-venta:active{background:var(--red2)}
    .btn-del-venta svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    /* ORIGEN MODAL */
    .origen-subtitle{font-size:14px;color:var(--text);margin-bottom:6px;line-height:1.4}
    .origen-subtitle strong{color:var(--red)}
    .origen-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:10px;text-align:left;transition:all .15s;font-family:"DM Sans",sans-serif}
    .origen-btn:active{background:var(--red-bg);border-color:var(--red)}
    .origen-icon{font-size:26px;flex-shrink:0}
    .origen-info{flex:1}
    .origen-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
    .origen-stock{font-size:13px;font-weight:500}
    .origen-stock-green{color:var(--green)}
    .origen-stock-red{color:var(--red)}
    .origen-arrow{font-size:20px;color:var(--red);font-weight:700;flex-shrink:0}
    .origen-btn-ninguno{width:100%;padding:12px;border:1.5px dashed var(--border2);border-radius:var(--rs);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:"DM Sans",sans-serif;margin-top:4px}
    .empty{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
    .empty strong{color:var(--red)}
    .loading{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
    .spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px;margin-right:7px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:380px){.metrics{gap:6px}.mval{font-size:20px}.fgrid{grid-template-columns:1fr}.cat-filter-bar{gap:5px}}
  </style>
</head>
<body>
<div class="hdr">
  <div class="logo-wrap">
    <div style="width:42px;height:42px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🏠</div>
    <div class="logo">Decotara<span>Gestión de Stock</span></div>
  </div>
  <div class="db-lbl"><span class="dot"></span>En línea</div>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('stock',this)">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>Almacén
  </button>
  <button class="tab" onclick="switchTab('tienda',this)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Tienda
  </button>
  <button class="tab" onclick="switchTab('ventas',this)">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>Ventas
  </button>
</div>
<div class="wrap">
  <div id="alert-box" class="alert"></div>
  <!-- ALMACÉN -->
  <div id="sec-stock" class="sec active">
    <div class="toolbar">
      <button class="btn-pdf" onclick="exportInventarioPDF()">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>PDF inventario
      </button>

let activeCatStock='Todos',activeCatTienda='Todos';

const CAT_DEFS=[
  {key:'Todos',label:'Todos',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'},

];

async function init(){
  const contenido = document.getElementById('stock-content');
  contenido.innerHTML='<div class="loading"><span class="spin"></span>Conectando con Supabase...</div>';

  // Test de conexión directo
  try {
    const test = await Promise.race([
      sb.from('stock').select('count', {count:'exact',head:true}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout de 10 segundos')),10000))
    ]);
    if(test.error) throw new Error(test.error.message);
  } catch(e) {
    contenido.innerHTML=`<div class="empty" style="color:var(--red);font-size:13px;line-height:1.6">
      <strong>Error de conexión</strong><br>${e.message}<br><br>
      URL: ${SUPABASE_URL.substring(0,40)}...
    </div>`;
    return;
  }

  const[rs,rv,rt]=await Promise.all([
    sb.from('stock').select('*').order('cat').order('name'),
    sb.from('sales').select('*').order('created_at',{ascending:false}),
    sb.from('stock_tienda').select('*').order('cat').order('name')
  ]);
  if(rs.error){
    contenido.innerHTML=`<div class="empty" style="color:var(--red)">Error stock: ${rs.error.message}</div>`;
    return;
  }
  if(rv.error) console.warn('Error ventas:',rv.error.message);
  if(rt.error) console.warn('Error tienda:',rt.error.message);
  stockData=rs.data||[];
  salesData=rv.error?[]:rv.data||[];
  tiendaData=rt.error?[]:rt.data||[];
  renderStock(); renderTienda(); renderSales();
}

function qi(qty){
  if(qty===0) return{cls:'b-zero',lbl:'Sin stock',nc:'zero'};
  if(qty<=2) return{cls:'b-low',lbl:'Stock bajo',nc:'low'};
  return{cls:'b-ok',lbl:'Disponible',nc:'ok'};
}

function buildCatBar(data,active,fn){
  let html='<div class="cat-filter-bar">';
  CAT_DEFS.forEach(function(c){
    const n=c.key==='Todos'?data.length:data.filter(function(p){return p.cat===c.key;}).length;
    const isActive=active===c.key?'active':'';
    const badge=n>0?'<span class="cat-filter-count">'+n+'</span>':'';
    html+='<button class="cat-filter-btn '+isActive+'" onclick="'+fn+'(\''+c.key+'\')">'+c.svg+'<span>'+c.label+'</span>'+badge+'</button>';
  });
  html+='</div>';
  return html;
}

function buildProds(prods,editFn,delFn,qtyFn){
  if(!prods.length) return '<div class="empty">No hay artículos en esta categoría.</div>';
  const cats={};
  prods.forEach(function(p){if(!cats[p.cat])cats[p.cat]=[];cats[p.cat].push(p);});
  let h='';
  Object.entries(cats).forEach(function(entry){
    const cat=entry[0], items=entry[1];
    h+='<div class="cat-block"><div class="cat-hdr"><span class="cat-pill">'+(CAT_ICONS[cat]||'📦')+' '+cat+'</span></div><div class="prod-list">';
    items.forEach(function(p){
      const b=qi(p.qty);
      const dis=p.qty===0?' disabled':'';
      h+='<div class="prod-row">'
        +'<div class="prod-top">'
        +'<div><div class="prod-name">'+p.name+'</div><span class="badge '+b.cls+'">'+b.lbl+'</span></div>'
        +'<div class="row-actions">'
        +'<button class="icon-btn edit" onclick="'+editFn+'(\''+p.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
        +'<button class="icon-btn del" onclick="'+delFn+'(\''+p.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>'
        +'</div></div>'
        +'<div class="prod-bottom"><div class="qty-ctrl">'
        +'<button class="bq" onclick="'+qtyFn+'(\''+p.id+'\',-1)"'+dis+'>−</button>'
        +'<span class="qnum '+b.nc+'">'+p.qty+'</span>'
        +'<button class="bq" onclick="'+qtyFn+'(\''+p.id+'\',1)">+</button>'
        +'</div></div></div>';
    });
    h+='</div></div>';
  });
  return h;
}

function setCatStock(c){activeCatStock=c;renderStock();}
function setCatTienda(c){activeCatTienda=c;renderTienda();}

function renderStock(){
  const zero=stockData.filter(p=>p.qty===0).length;
  const filtered=activeCatStock==='Todos'?stockData:stockData.filter(p=>p.cat===activeCatStock);
  let h=`<div class="metrics">
    <div class="metric"><div class="mlbl">Ventas</div><div class="mval">${salesData.length}</div></div>
    <div class="metric"><div class="mlbl">Sin stock</div><div class="mval ${zero>0?'warn':''}">${zero}</div></div>
  </div>`;
  h+=buildCatBar(stockData,activeCatStock,'setCatStock');
  h+=stockData.length?buildProds(filtered,'openEditModal','deleteProduct','changeQty'):'<div class="empty">No hay artículos. Pulsa <strong>Añadir artículo</strong>.</div>';
  h+=`<button class="btn-add-prod" onclick="openNewModal()"><svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Añadir artículo</button>`;
  document.getElementById('stock-content').innerHTML=h;
}

function renderTienda(){
  const total=tiendaData.reduce((s,p)=>s+p.qty,0);
  const zero=tiendaData.filter(p=>p.qty===0).length;
  const filtered=activeCatTienda==='Todos'?tiendaData:tiendaData.filter(p=>p.cat===activeCatTienda);
  let h=`<div class="metrics">
    <div class="metric"><div class="mlbl">Expuestos</div><div class="mval">${total}</div></div>
    <div class="metric"><div class="mlbl">Sin exponer</div><div class="mval ${zero>0?'warn':''}">${zero}</div></div>
  </div>`;
  h+=buildCatBar(tiendaData,activeCatTienda,'setCatTienda');
  h+=tiendaData.length?buildProds(filtered,'openEditTiendaModal','deleteTiendaProduct','changeTiendaQty'):'<div class="empty">No hay artículos en tienda. Pulsa <strong>Añadir artículo</strong>.</div>';
  h+=`<button class="btn-add-prod" onclick="openNewTiendaModal()"><svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Añadir artículo</button>`;
  document.getElementById('tienda-content').innerHTML=h;
}

/* STOCK CRUD */
async function changeQty(id,delta){
  const p=stockData.find(x=>x.id===id);if(!p)return;
  const nv=p.qty+delta;if(nv<0){showAlert('No hay más stock.','err');return;}
  p.qty=nv;renderStock();
  await sb.from('stock').update({qty:nv}).eq('id',id);
}
function openNewModal(){
  editingId=null;
  document.getElementById('modal-title').textContent='Nuevo artículo';
  document.getElementById('modal-id').value='';
  document.getElementById('modal-name').value='';
  document.getElementById('modal-cat').value='Sofás';
  document.getElementById('modal-qty').value='0';
  document.getElementById('modal-almacen').classList.add('open');
  setTimeout(()=>document.getElementById('modal-name').focus(),300);
}
function openEditModal(id){
  const p=stockData.find(x=>x.id===id);if(!p)return;
  editingId=id;
  document.getElementById('modal-title').textContent='Editar artículo';
  document.getElementById('modal-id').value=p.id;
  document.getElementById('modal-name').value=p.name;
  document.getElementById('modal-cat').value=p.cat;
  document.getElementById('modal-qty').value=p.qty;
  document.getElementById('modal-almacen').classList.add('open');
}
function closeModal(){document.getElementById('modal-almacen').classList.remove('open');editingId=null;}
async function saveProduct(){
  const name=document.getElementById('modal-name').value.trim();
  const cat=document.getElementById('modal-cat').value;
  const qty=parseInt(document.getElementById('modal-qty').value)||0;
  if(!name){showAlert('Escribe el nombre.','err');return;}
  if(editingId){
    await sb.from('stock').update({name,cat,qty}).eq('id',editingId);
    const p=stockData.find(x=>x.id===editingId);
    if(p){p.name=name;p.cat=cat;p.qty=qty;}
    showAlert(`"${name}" actualizado.`,'ok');
  }else{
    const id='p_'+Date.now();
    await sb.from('stock').insert([{id,name,cat,qty}]);
    stockData.push({id,name,cat,qty});
    stockData.sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name));
    showAlert(`"${name}" añadido.`,'ok');
  }
  closeModal();renderStock();
}
async function deleteProduct(id){
  const p=stockData.find(x=>x.id===id);if(!p)return;
  if(!confirm(`¿Eliminar "${p.name}"?`))return;
  await sb.from('stock').delete().eq('id',id);
  stockData=stockData.filter(x=>x.id!==id);
  renderStock();showAlert(`"${p.name}" eliminado.`,'ok');
}

/* BUSCADOR ARTÍCULO EN VENTA */
function filterProdSearch(){
  const q=(document.getElementById('prod-search-input').value||'').toLowerCase().trim();
  const dd=document.getElementById('prod-dropdown');
  const cb=document.getElementById('prod-search-clear');
  if(cb)cb.style.display=q?'flex':'none';
  const matches=q?stockData.filter(p=>p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)):stockData;
  if(!matches.length){dd.innerHTML='<div class="pd-empty">No se encontró ningún artículo</div>';dd.style.display='block';return;}
  const cats={};matches.forEach(p=>{if(!cats[p.cat])cats[p.cat]=[];cats[p.cat].push(p);});
  let h='';
  Object.entries(cats).forEach(([cat,prods])=>{
    h+=`<div class="pd-cat">${CAT_ICONS[cat]||'📦'} ${cat}</div>`;
    prods.forEach(p=>{
      const bi=p.qty===0?'pd-zero':p.qty<=2?'pd-low':'pd-ok';
      const bl=p.qty===0?'Sin stock':p.qty<=2?'Stock bajo':'';
      const hl=txt=>q?txt.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):txt;
      h+=`<div class="pd-item ${p.qty===0?'pd-disabled':''}" onclick="${p.qty>0?`selectProduct('${p.id}','${p.name.replace(/'/g,"\'")}',${p.qty})`:''}">
        <div class="pd-name">${hl(p.name)}</div>
        <div class="pd-right">${bl?`<span class="pd-badge ${bi}">${bl}</span>`:''}<span class="pd-qty ${bi}">${p.qty}</span></div>
      </div>`;
    });
  });
  dd.innerHTML=h;dd.style.display='block';
}
function selectProduct(id,name,qty){
  document.getElementById('sale-product').value=id;
  document.getElementById('prod-search-input').value=`${name}  ·  ${qty} ud.`;
  document.getElementById('prod-search-clear').style.display='flex';
  document.getElementById('prod-dropdown').style.display='none';
}
function clearProdSearch(){
  document.getElementById('sale-product').value='';
  document.getElementById('prod-search-input').value='';
  document.getElementById('prod-search-clear').style.display='none';
  document.getElementById('prod-dropdown').style.display='none';
  document.getElementById('prod-search-input').focus();
}
document.addEventListener('click',e=>{
  const w=document.getElementById('prod-search-wrap');
  if(w&&!w.contains(e.target)) document.getElementById('prod-dropdown').style.display='none';
});

/* VENTAS */
function renderSales(){
  const el=document.getElementById('ventas-list');
  const q=(document.getElementById('ventas-search')?.value||'').toLowerCase().trim();
  const cb=document.getElementById('search-clear');
  if(cb)cb.style.display=q?'flex':'none';
  const filtered=q?salesData.filter(s=>
    s.client.toLowerCase().includes(q)||
    (s.albaran||'').toLowerCase().includes(q)||
    (s.product||'').toLowerCase().includes(q)||
    (s.date||'').includes(q)
  ):salesData;
  if(!salesData.length){el.innerHTML='<div class="empty">No hay ventas registradas todavía.</div>';return;}
  if(!filtered.length){el.innerHTML=`<div class="empty">Sin resultados para "<strong>${q}</strong>".</div>`;return;}
  const counter=q?`<div class="search-count">${filtered.length} resultado${filtered.length!==1?'s':''} para "<strong>${q}</strong>"</div>`:'';
  const hl=txt=>q?txt.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):txt;
  el.innerHTML=counter+filtered.map(s=>{
    const d=s.date?s.date.split('-').reverse().join('/'):'';
    return `<div class="venta-card">
      <div class="venta-card-top">
        <div><div class="venta-client">${hl(s.client)}</div><span class="venta-alb">${hl(s.albaran||'')}</span></div>
        <span class="venta-date">${d}</span>
      </div>
      <div class="venta-body">
        <div class="venta-info">
          <span class="venta-chip">${hl(s.product||'')}</span>
          <span class="venta-chip qty">${s.qty} ud.</span>
          ${s.origen?`<span class="venta-chip origen">${s.origen}</span>`:''}
        </div>
        <button class="btn-del-venta" onclick="deleteSale(${s.id})">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Eliminar venta entregada
        </button>
      </div>
    </div>`;
  }).join('');
}
function clearSearch(){
  const i=document.getElementById('ventas-search');
  if(i){i.value='';i.focus();}
  renderSales();
}
async function deleteSale(id){
  if(!confirm('¿Eliminar esta venta?
El stock NO se modificará.'))return;
  await sb.from('sales').delete().eq('id',id);
  salesData=salesData.filter(s=>s.id!==id);
  renderSales();renderStock();showAlert('Venta eliminada.','ok');
}

/* REGISTRAR VENTA */
async function addSale(){
  const client=(document.getElementById('sale-client').value||'').trim();
  const albaran=(document.getElementById('sale-albaran').value||'').trim();
  const date=document.getElementById('sale-date').value;
  const productId=document.getElementById('sale-product').value;
  const qty=parseInt(document.getElementById('sale-qty').value)||1;
  const p=stockData.find(x=>x.id===productId);
  if(!client){showAlert('Indica el nombre del cliente.','err');return;}
  if(!albaran){showAlert('Introduce el número de albarán.','err');return;}
  if(!date){showAlert('Selecciona la fecha.','err');return;}
  if(!p){showAlert('Selecciona un artículo válido.','err');return;}
  const tiendaMatch=tiendaData.find(t=>t.name.toLowerCase()===p.name.toLowerCase()||t.name.toLowerCase().includes(p.name.toLowerCase())||p.name.toLowerCase().includes(t.name.toLowerCase()));
  const hayAlmacen=p.qty>=qty;
  const hayTienda=tiendaMatch&&tiendaMatch.qty>=qty;
  if(hayAlmacen&&hayTienda){openOrigenModal(p,tiendaMatch,qty,client,albaran,date);return;}
  if(hayAlmacen){await confirmarVenta('almacen',p,tiendaMatch,qty,client,albaran,date);return;}
  if(hayTienda){await confirmarVenta('tienda',p,tiendaMatch,qty,client,albaran,date);return;}
  showAlert(`Stock insuficiente — Almacén: ${p.qty} ud. / Tienda: ${tiendaMatch?tiendaMatch.qty:0} ud.`,'err');
}
function openOrigenModal(p,tiendaMatch,qty,client,albaran,date){
  document.getElementById('origen-modal-body').innerHTML=`
    <div class="origen-subtitle">Venta de <strong>${qty} × ${p.name}</strong> para <strong>${client}</strong></div>
    <div class="origen-subtitle" style="margin-bottom:16px">Hay stock en los dos sitios. ¿Desde dónde se descuenta?</div>
    <button class="origen-btn" onclick="confirmarVentaModal('almacen')">
      <div class="origen-icon">🏭</div>
      <div class="origen-info"><div class="origen-name">Stock Almacén</div><div class="origen-stock origen-stock-green">${p.qty} ud. disponibles</div></div>
      <div class="origen-arrow">→</div>
    </button>
    <button class="origen-btn" onclick="confirmarVentaModal('tienda')">
      <div class="origen-icon">🏠</div>
      <div class="origen-info"><div class="origen-name">Stock Tienda</div><div class="origen-stock origen-stock-green">${tiendaMatch.qty} ud. disponibles</div></div>
      <div class="origen-arrow">→</div>
    </button>
    <button class="origen-btn-ninguno" onclick="confirmarVentaModal('ninguno')">Solo registrar, sin descontar stock</button>
  `;
  window._pendingSale={p,tiendaMatch,qty,client,albaran,date};
  document.getElementById('origen-overlay').classList.add('open');
}
async function confirmarVentaModal(origen){
  document.getElementById('origen-overlay').classList.remove('open');
  const{p,tiendaMatch,qty,client,albaran,date}=window._pendingSale;
  await confirmarVenta(origen,p,tiendaMatch,qty,client,albaran,date);
}
async function confirmarVenta(origen,p,tiendaMatch,qty,client,albaran,date){
  const btn=document.getElementById('sale-btn');
  btn.disabled=true;btn.textContent='Guardando...';
  const origenLabel=origen==='almacen'?'Almacén':origen==='tienda'?'Tienda':'Sin descontar';
  const{data:row,error}=await sb.from('sales').insert([{date,albaran,client,product:p.name,product_id:p.id,qty,origen:origenLabel}]).select().single();
  if(error){showAlert('Error al registrar.','err');btn.disabled=false;btn.textContent='Registrar venta';return;}
  if(origen==='almacen'){const nq=p.qty-qty;await sb.from('stock').update({qty:nq}).eq('id',p.id);p.qty=nq;}
  else if(origen==='tienda'&&tiendaMatch){const nq=tiendaMatch.qty-qty;await sb.from('stock_tienda').update({qty:nq}).eq('id',tiendaMatch.id);tiendaMatch.qty=nq;renderTienda();}
  salesData.unshift(row);
  document.getElementById('sale-client').value='';
  document.getElementById('sale-albaran').value='';
  document.getElementById('sale-qty').value='1';
  document.getElementById('sale-date').value=new Date().toISOString().split('T')[0];
  clearProdSearch();
  renderSales();renderStock();
  btn.disabled=false;btn.textContent='Registrar venta';
  showAlert(`Venta registrada — ${qty}×${p.name} para ${client} (${origenLabel}).`,'ok');
}

/* PDF */
const LOGO_B64="";
function pdfHeader(doc,title,subtitle,r1,r2,W,M){
  doc.setFillColor(100,0,10);doc.rect(0,0,W,48,'F');
  doc.setFillColor(192,0,26);doc.rect(0,14,W,34,'F');
  doc.setDrawColor(255,255,255);doc.setLineWidth(0.4);doc.line(M,44,W-M,44);
  doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(255,255,255);
  doc.text('Decotara',M,20);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(255,200,205);
  doc.text('OUTLET',M+doc.getTextWidth('Decotara')+3,20);
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(255,200,205);
  doc.setCharSpace(2);doc.text(title,M,28);doc.setCharSpace(0);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(255,235,237);
  doc.text(subtitle,M,35);
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);
  doc.text(r1,W-M,20,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(255,200,205);
  doc.text(r2,W-M,28,{align:'right'});doc.setLineWidth(0.2);
}
function pdfFooter(doc,l,r,W,M){
  doc.setFillColor(100,0,10);doc.rect(0,284,W,14,'F');
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(255,200,205);
  doc.text(l,M,291);doc.text(r,W-M,291,{align:'right'});
}
function pdfCatRows(doc,data,y,W,M){
  const cats={};data.forEach(p=>{if(!cats[p.cat])cats[p.cat]=[];cats[p.cat].push(p);});
  Object.entries(cats).forEach(([cat,prods])=>{
    if(y>260){doc.addPage();y=20;}
    doc.setFillColor(255,240,242);doc.roundedRect(M,y-6,W-M*2,11,2,2,'F');
    doc.setFillColor(192,0,26);doc.rect(M,y-6,3,11,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(140,0,18);
    doc.text(cat.toUpperCase(),M+7,y+1.5);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(192,0,26);
    doc.text(`${prods.length} artículo${prods.length!==1?'s':''}`,W-M-2,y+1.5,{align:'right'});
    y+=14;
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(150,0,20);
    doc.text('ARTÍCULO',M+2,y);doc.text('ESTADO',W-M-50,y);doc.text('UNIDADES',W-M-2,y,{align:'right'});
    y+=1.5;doc.setDrawColor(192,0,26);doc.line(M,y,W-M,y);y+=4.5;
    prods.forEach((p,i)=>{
      if(y>272){doc.addPage();y=20;}
      if(i%2===0){doc.setFillColor(255,245,247);doc.rect(M,y-3.5,W-M*2,8,'F');}
      let tc,pc;
      if(p.qty===0){tc=[170,40,40];pc=[220,80,80];}
      else if(p.qty<=2){tc=[160,80,20];pc=[220,140,40];}
      else{tc=[35,110,55];pc=[70,170,100];}
      doc.setFillColor(...pc);doc.circle(M+3,y,1.2,'F');
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(28,26,23);
      doc.text(p.name,M+7,y+0.5);
      const bt=p.qty===0?'Sin stock':p.qty<=2?'Stock bajo':'Disponible';
      doc.setFillColor(...tc.map(v=>Math.min(255,v+180)));doc.roundedRect(W-M-52,y-3,32,5.5,1.5,1.5,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...tc);
      doc.text(bt,W-M-36,y+0.8,{align:'center'});
      doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...tc);
      doc.text(String(p.qty),W-M-2,y+1,{align:'right'});
      y+=9;
    });
    y+=5;
  });
  return y;
}
function exportInventarioPDF(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const now=new Date();
  const fd=now.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fh=now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const sinStock=stockData.filter(p=>p.qty===0).length;
  const W=210,M=18;
  pdfHeader(doc,'INFORME DE INVENTARIO',`Generado el ${fd} a las ${fh}`,`Sin stock: ${sinStock}`,`${stockData.length} artículos`,W,M);
  pdfCatRows(doc,stockData,58,W,M);
  pdfFooter(doc,`Decotara Stock · Inventario ${fd}`,`${fd} ${fh}`,W,M);
  doc.save(`inventario-decotara-${now.toISOString().split('T')[0]}.pdf`);
  showAlert('PDF de inventario descargado.','ok');
}
function exportTiendaPDF(){
  if(!tiendaData.length){showAlert('No hay artículos en tienda.','err');return;}
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const now=new Date();
  const fd=now.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fh=now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const total=tiendaData.reduce((s,p)=>s+p.qty,0);
  const W=210,M=18;
  pdfHeader(doc,'STOCK TIENDA',`Generado el ${fd} a las ${fh}`,`Expuestos: ${total}`,`${tiendaData.length} artículos`,W,M);
  pdfCatRows(doc,tiendaData,58,W,M);
  pdfFooter(doc,`Decotara Stock · Tienda ${fd}`,`Total: ${total} ud.`,W,M);
  doc.save(`stock-tienda-${now.toISOString().split('T')[0]}.pdf`);
  showAlert('PDF de tienda descargado.','ok');
}
function exportVentasPDF(){
  if(!salesData.length){showAlert('No hay ventas para exportar.','err');return;}
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const now=new Date();
  const fd=now.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fh=now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const totalUds=salesData.reduce((s,v)=>s+v.qty,0);
  const W=210,M=18;let y=58;
  pdfHeader(doc,'INFORME DE VENTAS',`Generado el ${fd} a las ${fh}`,`${salesData.length} ventas`,`${totalUds} uds. vendidas`,W,M);
  function drawHdr(){
    doc.setFillColor(255,240,242);doc.roundedRect(M,y-5,W-M*2,10,2,2,'F');
    doc.setFillColor(192,0,26);doc.rect(M,y-5,3,10,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(140,0,18);
    doc.text('FECHA',M+7,y);doc.text('ALBARÁN',M+33,y);
    doc.text('CLIENTE',M+68,y);doc.text('ARTÍCULO',M+112,y);doc.text('UD.',W-M-2,y,{align:'right'});
    y+=5;doc.setDrawColor(192,0,26);doc.line(M,y,W-M,y);y+=5;
  }
  drawHdr();
  salesData.forEach((s,i)=>{
    if(y>274){doc.addPage();y=20;drawHdr();}
    if(i%2===0){doc.setFillColor(255,245,247);doc.rect(M,y-3.5,W-M*2,9,'F');}
    const d=s.date?s.date.split('-').reverse().join('/'):'';
    doc.setFillColor(192,0,26);doc.circle(M+3,y,1.2,'F');
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(28,26,23);
    doc.text(d,M+7,y+0.5);
    const aw=doc.getTextWidth(s.albaran||'')+6;
    doc.setFillColor(255,225,230);doc.roundedRect(M+30,y-3,aw,5.5,1.5,1.5,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(192,0,26);
    doc.text(s.albaran||'',M+33,y+0.8);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(28,26,23);
    const cl=(s.client||'').length>18?(s.client||'').substring(0,17)+'.':s.client||'';
    const pr=(s.product||'').length>22?(s.product||'').substring(0,21)+'.':s.product||'';
    doc.text(cl,M+68,y+0.5);doc.text(pr,M+112,y+0.5);
    doc.setFillColor(192,0,26);doc.circle(W-M-5,y,4,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);
    doc.text(String(s.qty),W-M-5,y+0.8,{align:'center'});
    y+=9.5;
  });
  pdfFooter(doc,`Decotara Stock · Ventas ${fd}`,`${salesData.length} ventas · ${totalUds} uds.`,W,M);
  doc.save(`ventas-decotara-${now.toISOString().split('T')[0]}.pdf`);
  showAlert('PDF de ventas descargado.','ok');
}

function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sec-'+tab).classList.add('active');
}
function showAlert(msg,type){
  const el=document.getElementById('alert-box');
  el.textContent=msg;el.className='alert alert-'+(type==='err'?'err':'ok');
  el.style.display='block';clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.display='none',4500);
}
