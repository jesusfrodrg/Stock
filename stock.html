<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Decotara">
  <title>Decotara Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{
      --red:#C0001A; --red2:#9A0015; --red3:#FF1A35;
      --red-bg:#FFF0F2; --red-border:#FFCCD3;
      --dark:#1A0A0C; --dark2:#2D1518;
      --bg:#FDF7F7; --bg2:#F5EAEB;
      --card:#FFFFFF; --border:#EDD5D8; --border2:#E0C0C4;
      --text:#1A0A0C; --muted:#8A5C62;
      --green:#1A6B3A; --green-bg:#E6F7ED; --green-border:#A8D9BA;
      --amber:#B86A00; --amber-bg:#FFF5E0;
      --r:14px; --rs:9px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:50px}

    /* ── HEADER ── */
    .hdr{
      background:linear-gradient(135deg,var(--dark2) 0%,var(--red2) 60%,var(--red) 100%);
      padding:0 18px;
      display:flex;align-items:stretch;justify-content:space-between;
      position:sticky;top:0;z-index:200;
      box-shadow:0 2px 16px rgba(192,0,26,.35);
    }
    .logo-wrap{display:flex;align-items:center;gap:10px;padding:14px 0}
    .logo-icon{width:34px;height:34px;background:rgba(255,255,255,.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .logo{font-family:'Playfair Display',serif;font-size:20px;color:#fff;letter-spacing:.01em;line-height:1}
    .logo span{color:rgba(255,200,205,.85);font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;display:block;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
    .db-lbl{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,210,215,.9);font-weight:500;padding:14px 0}
    .dot{width:7px;height:7px;border-radius:50%;background:#4DDB80;flex-shrink:0;animation:pulse 2s infinite;box-shadow:0 0 6px rgba(77,219,128,.6)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

    /* ── TABS ── */
    .tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border)}
    .tab{flex:1;padding:13px 0;text-align:center;font-size:14px;font-weight:600;color:var(--muted);border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:'DM Sans',sans-serif;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
    .tab.active{color:var(--red);border-bottom-color:var(--red);background:linear-gradient(to bottom,#fff,var(--red-bg))}
    .tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .wrap{padding:16px;max-width:680px;margin:0 auto}
    .sec{display:none}.sec.active{display:block}

    /* ── ALERT ── */
    .alert{padding:12px 15px;border-radius:var(--rs);font-size:13px;margin-bottom:14px;display:none;font-weight:500;display:none}
    .alert-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
    .alert-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}

    /* ── METRICS ── */
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .metric{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
    .metric::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--red)}
    .mlbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
    .mval{font-size:26px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace}
    .mval.warn{color:var(--red)}

    /* ── CATEGORY ── */
    .cat-block{margin-bottom:22px}
    .cat-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .cat-pill{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}

    /* ── PRODUCT CARDS ── */
    .prod-list{display:flex;flex-direction:column;gap:8px}
    .prod-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 4px rgba(192,0,26,.06);transition:box-shadow .15s}
    .prod-row:active{box-shadow:0 3px 12px rgba(192,0,26,.12)}
    .prod-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px}
    .prod-name{font-size:15px;font-weight:600;color:var(--text);line-height:1.3;flex:1}
    .badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;margin-top:5px}
    .b-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
    .b-low{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
    .b-zero{background:var(--amber-bg);color:var(--amber);border:1px solid #F5D88A}

    .prod-bottom{display:flex;align-items:center;justify-content:space-between}
    .qty-ctrl{display:flex;align-items:center;gap:10px}
    .qnum{font-size:30px;font-weight:700;font-family:'DM Mono',monospace;min-width:38px;text-align:center;line-height:1}
    .qnum.ok{color:var(--green)}.qnum.low{color:var(--red)}.qnum.zero{color:var(--amber)}
    .bq{width:40px;height:40px;border-radius:var(--rs);border:1.5px solid var(--border2);background:var(--bg2);cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;color:var(--red2);font-weight:700;transition:all .12s;user-select:none;flex-shrink:0}
    .bq:active{background:var(--red);color:#fff;border-color:var(--red)}
    .bq:disabled{opacity:.25;cursor:not-allowed}

    .row-actions{display:flex;gap:6px}
    .icon-btn{width:38px;height:38px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
    .icon-btn svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .icon-btn.edit:active{background:var(--red-bg);border-color:var(--red-border)}
    .icon-btn.edit:active svg{stroke:var(--red)}
    .icon-btn.del:active{background:var(--dark);border-color:var(--dark)}
    .icon-btn.del:active svg{stroke:#fff}

    .btn-add-prod{width:100%;padding:14px;border:2px dashed var(--red-border);border-radius:var(--r);background:var(--red-bg);color:var(--red);font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;margin-top:6px}
    .btn-add-prod:active{background:var(--red);color:#fff;border-color:var(--red)}

    .btn-pdf{display:flex;align-items:center;gap:7px;padding:10px 18px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;box-shadow:0 2px 8px rgba(192,0,26,.3)}
    .btn-pdf svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .toolbar{display:flex;justify-content:flex-end;margin-bottom:14px}

    /* ── MODAL ── */
    .overlay{position:fixed;inset:0;background:rgba(26,10,12,.55);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
    .overlay.open{display:flex}
    .modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:500px;padding:6px 18px 36px;animation:slideUp .22s ease}
    .modal-handle{width:40px;height:4px;background:var(--border2);border-radius:4px;margin:12px auto 18px}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-title{font-size:17px;font-weight:700;margin-bottom:18px;color:var(--text)}
    .mfield{margin-bottom:14px}
    .mfield label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
    .mfield input,.mfield select{width:100%;padding:12px 13px;border-radius:var(--rs);border:1.5px solid var(--border);font-size:15px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-appearance:none;transition:border-color .15s}
    .mfield input:focus,.mfield select:focus{outline:none;border-color:var(--red);background:#fff}
    .modal-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:20px}
    .btn-cancel{padding:13px;border:1.5px solid var(--border2);border-radius:var(--rs);background:transparent;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted)}
    .btn-save{padding:13px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(192,0,26,.35)}

    /* ── SALE FORM ── */
    .sale-form{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 1px 4px rgba(192,0,26,.06)}
    .form-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:8px}
    .form-title::before{content:'';width:4px;height:20px;background:var(--red);border-radius:2px;display:inline-block}
    .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .fgroup label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
    .fgroup input,.fgroup select{width:100%;padding:10px 12px;border-radius:var(--rs);border:1.5px solid var(--border);font-size:14px;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-appearance:none;transition:border-color .15s}
    .fgroup input:focus,.fgroup select:focus{outline:none;border-color:var(--red);background:#fff}
    .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(192,0,26,.3);letter-spacing:.02em}
    .btn-primary:disabled{opacity:.5}

    /* ── VENTA CARDS ── */
    .venta-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;box-shadow:0 1px 4px rgba(192,0,26,.06)}
    .venta-card-top{background:linear-gradient(135deg,var(--dark2),var(--red2));padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .venta-client{font-size:15px;font-weight:700;color:#fff}
    .venta-alb{font-family:'DM Mono',monospace;font-size:11px;background:rgba(255,255,255,.18);color:#fff;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;margin-top:4px;letter-spacing:.04em}
    .venta-date{font-size:11px;color:rgba(255,210,215,.85);font-weight:500;flex-shrink:0;background:rgba(0,0,0,.2);padding:3px 8px;border-radius:20px}
    .venta-body{padding:12px 14px}
    .venta-info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .venta-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-weight:500}
    .venta-chip.qty{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;border:none;font-weight:700}
    .btn-del-venta{width:100%;padding:14px;border:none;border-radius:var(--rs);background:var(--red);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .12s;letter-spacing:.02em;box-shadow:0 2px 6px rgba(192,0,26,.3)}
    .btn-del-venta:active{background:var(--red2);transform:scale(.98)}
    .btn-del-venta svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

    .empty{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
    .loading{text-align:center;padding:3rem;color:var(--muted);font-size:14px}
    .spin{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px;margin-right:7px}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:380px){
      .metrics{grid-template-columns:1fr 1fr;gap:7px}.mval{font-size:22px}
      .fgrid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<div class="hdr">
  <div class="logo-wrap">
    <div class="logo-icon">🏠</div>
    <div class="logo">Decotara<span>Gestión de Stock</span></div>
  </div>
  <div class="db-lbl"><span class="dot"></span>En línea</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('stock',this)">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
    Stock
  </button>
  <button class="tab" onclick="switchTab('ventas',this)">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Ventas
  </button>
</div>

<div class="wrap">
  <div id="alert-box" class="alert"></div>

  <!-- STOCK -->
  <div id="sec-stock" class="sec active">
    <div class="toolbar">
      <button class="btn-pdf" onclick="exportInventarioPDF()">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        PDF inventario
      </button>
    </div>
    <div id="stock-content"><div class="loading"><span class="spin"></span>Cargando...</div></div>
  </div>

  <!-- VENTAS -->
  <div id="sec-ventas" class="sec">
    <div class="sale-form">
      <div class="form-title">Registrar venta</div>
      <div class="fgrid">
        <div class="fgroup"><label>Cliente</label><input type="text" id="sale-client" placeholder="Nombre del cliente" autocomplete="off"></div>
        <div class="fgroup"><label>N. Albarán</label><input type="text" id="sale-albaran" placeholder="ALB-0001" autocomplete="off"></div>
        <div class="fgroup"><label>Fecha</label><input type="date" id="sale-date"></div>
        <div class="fgroup"><label>Producto</label><select id="sale-product"></select></div>
      </div>
      <div class="fgrid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
        <div class="fgroup"><label>Cantidad</label><input type="number" id="sale-qty" value="1" min="1" max="99"></div>
        <div></div>
      </div>
      <button class="btn-primary" id="sale-btn" onclick="addSale()">Registrar venta</button>
    </div>
    <div class="toolbar">
      <button class="btn-pdf" onclick="exportVentasPDF()">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        PDF ventas
      </button>
    </div>
    <div id="ventas-list"><div class="loading"><span class="spin"></span>Cargando...</div></div>
  </div>
</div>

<!-- MODAL PRODUCTO -->
<div class="overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Nuevo artículo</div>
    <input type="hidden" id="modal-id">
    <div class="mfield">
      <label>Nombre del artículo</label>
      <input type="text" id="modal-name" placeholder="Ej: Canapé 150, Colchón 180x200...">
    </div>
    <div class="mfield">
      <label>Categoría</label>
      <select id="modal-cat">
        <option value="Sofás">Sofás</option>
        <option value="Canapés">Canapés</option>
        <option value="Colchones">Colchones</option>
        <option value="Otros">Otros</option>
      </select>
    </div>
    <div class="mfield">
      <label>Stock inicial</label>
      <input type="number" id="modal-qty" value="0" min="0">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveProduct()">Guardar artículo</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://uflikwunrowiygcrngrz.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmbGlrd3Vucm93aXlnY3JuZ3J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NDU4NzIsImV4cCI6MjA5NTMyMTg3Mn0.2l8epSukKpS1qMDMuxif3xspWIWx-EeN1D4iZlh1ZHA';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let stockData=[];
let salesData=[];
let editingId=null;

document.getElementById('sale-date').value=new Date().toISOString().split('T')[0];

async function init(){
  await loadStock(); await loadSales();
  renderStock(); populateSelect(); renderSales();
}

async function loadStock(){
  const {data,error}=await sb.from('stock').select('*').order('cat').order('name');
  if(!error&&data) stockData=data;
}
async function loadSales(){
  const {data,error}=await sb.from('sales').select('*').order('created_at',{ascending:false});
  if(!error&&data) salesData=data;
}

function qi(qty){
  if(qty===0) return {cls:'b-zero',lbl:'Sin stock',nc:'zero'};
  if(qty<=2) return {cls:'b-low',lbl:'Stock bajo',nc:'low'};
  return {cls:'b-ok',lbl:'Disponible',nc:'ok'};
}

function renderStock(){
  const total=stockData.reduce((s,p)=>s+p.qty,0);
  const zero=stockData.filter(p=>p.qty===0).length;

  let html=`<div class="metrics">
    <div class="metric"><div class="mlbl">Ventas</div><div class="mval">${salesData.length}</div></div>
    <div class="metric"><div class="mlbl">Sin stock</div><div class="mval ${zero>0?'warn':''}">${zero}</div></div>
  </div>`;

  const cats={};
  stockData.forEach(p=>{if(!cats[p.cat])cats[p.cat]=[];cats[p.cat].push(p);});
  const catIcons={'Sofás':'🛋️','Canapés':'🛏️','Colchones':'😴','Otros':'📦'};

  Object.entries(cats).forEach(([cat,prods])=>{
    html+=`<div class="cat-block">
      <div class="cat-hdr"><span class="cat-pill">${catIcons[cat]||'📦'} ${cat}</span></div>
      <div class="prod-list">`;
    prods.forEach(p=>{
      const b=qi(p.qty);
      html+=`<div class="prod-row">
        <div class="prod-top">
          <div>
            <div class="prod-name">${p.name}</div>
            <span class="badge ${b.cls}">${b.lbl}</span>
          </div>
          <div class="row-actions">
            <button class="icon-btn edit" onclick="openEditModal('${p.id}')" aria-label="Editar">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="icon-btn del" onclick="deleteProduct('${p.id}')" aria-label="Eliminar">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
        </div>
        <div class="prod-bottom">
          <div class="qty-ctrl">
            <button class="bq" onclick="changeQty('${p.id}',-1)" ${p.qty===0?'disabled':''}>−</button>
            <span class="qnum ${b.nc}">${p.qty}</span>
            <button class="bq" onclick="changeQty('${p.id}',1)">+</button>
          </div>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });

  html+=`<button class="btn-add-prod" onclick="openNewModal()">
    <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Añadir artículo
  </button>`;

  document.getElementById('stock-content').innerHTML=html;
}

async function changeQty(id,delta){
  const p=stockData.find(x=>x.id===id);
  if(!p) return;
  const nv=p.qty+delta;
  if(nv<0){showAlert('No hay más stock para restar.','err');return;}
  p.qty=nv; renderStock(); populateSelect();
  await sb.from('stock').update({qty:nv}).eq('id',id);
}

function openNewModal(){
  editingId=null;
  document.getElementById('modal-title').textContent='Nuevo artículo';
  document.getElementById('modal-id').value='';
  document.getElementById('modal-name').value='';
  document.getElementById('modal-cat').value='Sofás';
  document.getElementById('modal-qty').value='0';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('modal-name').focus(),300);
}

function openEditModal(id){
  const p=stockData.find(x=>x.id===id);
  if(!p) return;
  editingId=id;
  document.getElementById('modal-title').textContent='Editar artículo';
  document.getElementById('modal-id').value=p.id;
  document.getElementById('modal-name').value=p.name;
  document.getElementById('modal-cat').value=p.cat;
  document.getElementById('modal-qty').value=p.qty;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');editingId=null;}
function closeModalOutside(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

async function saveProduct(){
  const name=document.getElementById('modal-name').value.trim();
  const cat=document.getElementById('modal-cat').value;
  const qty=parseInt(document.getElementById('modal-qty').value)||0;
  if(!name){showAlert('Escribe el nombre del artículo.','err');return;}
  if(editingId){
    const {error}=await sb.from('stock').update({name,cat,qty}).eq('id',editingId);
    if(error){showAlert('Error al guardar.','err');return;}
    const p=stockData.find(x=>x.id===editingId);
    if(p){p.name=name;p.cat=cat;p.qty=qty;}
    showAlert(`"${name}" actualizado.`,'ok');
  } else {
    const id='p_'+Date.now();
    const {error}=await sb.from('stock').insert([{id,name,cat,qty}]);
    if(error){showAlert('Error al guardar.','err');return;}
    stockData.push({id,name,cat,qty});
    showAlert(`"${name}" añadido.`,'ok');
  }
  closeModal();
  stockData.sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name));
  renderStock(); populateSelect();
}

async function deleteProduct(id){
  const p=stockData.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`¿Eliminar "${p.name}" del stock?`)) return;
  const {error}=await sb.from('stock').delete().eq('id',id);
  if(error){showAlert('Error al eliminar.','err');return;}
  stockData=stockData.filter(x=>x.id!==id);
  renderStock(); populateSelect();
  showAlert(`"${p.name}" eliminado.`,'ok');
}

function populateSelect(){
  const sel=document.getElementById('sale-product');
  if(!sel) return;
  const prev=sel.value; sel.innerHTML='';
  stockData.forEach(p=>{
    const o=document.createElement('option');
    o.value=p.id; o.textContent=`${p.name} (${p.qty} ud.)`;
    sel.appendChild(o);
  });
  if(prev) sel.value=prev;
}

function renderSales(){
  const el=document.getElementById('ventas-list');
  if(!salesData.length){el.innerHTML=`<div class="empty">No hay ventas registradas todavía.</div>`;return;}
  el.innerHTML=salesData.map(s=>{
    const d=s.date?s.date.split('-').reverse().join('/'):'';
    return `<div class="venta-card">
      <div class="venta-card-top">
        <div>
          <div class="venta-client">${s.client}</div>
          <span class="venta-alb">${s.albaran}</span>
        </div>
        <span class="venta-date">${d}</span>
      </div>
      <div class="venta-body">
        <div class="venta-info">
          <span class="venta-chip">${s.product}</span>
          <span class="venta-chip qty">${s.qty} ud.</span>
        </div>
        <button class="btn-del-venta" onclick="deleteSale(${s.id})">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Eliminar venta entregada
        </button>
      </div>
    </div>`;
  }).join('');
}

async function addSale(){
  const client=(document.getElementById('sale-client').value||'').trim();
  const albaran=(document.getElementById('sale-albaran').value||'').trim();
  const date=document.getElementById('sale-date').value;
  const productId=document.getElementById('sale-product').value;
  const qty=parseInt(document.getElementById('sale-qty').value)||1;
  const p=stockData.find(x=>x.id===productId);
  if(!client){showAlert('Indica el nombre del cliente.','err');return;}
  if(!albaran){showAlert('Introduce el número de albarán.','err');return;}
  if(!date){showAlert('Selecciona la fecha.','err');return;}
  if(!p){showAlert('Selecciona un producto.','err');return;}
  if(p.qty<qty){showAlert(`Solo quedan ${p.qty} ud. de ${p.name}.`,'err');return;}
  const btn=document.getElementById('sale-btn');
  btn.disabled=true;btn.textContent='Guardando...';
  const {data:row,error}=await sb.from('sales').insert([{date,albaran,client,product:p.name,product_id:p.id,qty}]).select().single();
  if(error){showAlert('Error al registrar.','err');btn.disabled=false;btn.textContent='Registrar venta';return;}
  const nq=p.qty-qty;
  await sb.from('stock').update({qty:nq}).eq('id',p.id);
  p.qty=nq; salesData.unshift(row);
  document.getElementById('sale-client').value='';
  document.getElementById('sale-albaran').value='';
  document.getElementById('sale-qty').value='1';
  document.getElementById('sale-date').value=new Date().toISOString().split('T')[0];
  renderSales();renderStock();populateSelect();
  btn.disabled=false;btn.textContent='Registrar venta';
  showAlert(`Venta registrada — ${qty}×${p.name} para ${client}.`,'ok');
}

async function deleteSale(id){
  if(!confirm('¿Eliminar esta venta?\nEl stock NO se modificará.')) return;
  const {error}=await sb.from('sales').delete().eq('id',id);
  if(error){showAlert('Error al eliminar.','err');return;}
  salesData=salesData.filter(s=>s.id!==id);
  renderSales();renderStock();populateSelect();
  showAlert('Venta eliminada.','ok');
}

function pdfHeader(doc,title,subtitle,right1,right2,W,M){
  // Fondo degradado simulado con dos rectángulos
  doc.setFillColor(60,30,15); doc.rect(0,0,W,48,'F');
  doc.setFillColor(139,58,30); doc.rect(0,14,W,34,'F');
  // Línea decorativa dorada
  doc.setDrawColor(210,160,80); doc.setLineWidth(0.6);
  doc.line(M,44,W-M,44);
  // Logo
  doc.setFont('helvetica','bold'); doc.setFontSize(24); doc.setTextColor(255,255,255);
  doc.text('Decotara',M,13);
  doc.setFont('helvetica','normal'); doc.setFontSize(24); doc.setTextColor(210,160,80);
  doc.text(' Stock',M+doc.getTextWidth('Decotara'),13);
  // Título
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(255,220,180);
  doc.setCharSpace(2); doc.text(title,M,22); doc.setCharSpace(0);
  // Subtítulo
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(255,245,235);
  doc.text(subtitle,M,30);
  // Info derecha
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(210,160,80);
  doc.text(right1,W-M,22,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(255,235,210);
  doc.text(right2,W-M,30,{align:'right'});
  doc.setLineWidth(0.2);
}

function pdfFooter(doc,left,right,W,M){
  doc.setFillColor(40,20,10); doc.rect(0,284,W,14,'F');
  doc.setDrawColor(210,160,80); doc.setLineWidth(0.4);
  doc.line(M,284.5,W-M,284.5); doc.setLineWidth(0.2);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(210,160,80);
  doc.text(left,M,291);
  doc.text(right,W-M,291,{align:'right'});
}

function exportInventarioPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const now=new Date();
  const fd=now.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fh=now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const sinStock=stockData.filter(p=>p.qty===0).length;
  const bajStock=stockData.filter(p=>p.qty>0&&p.qty<=2).length;
  const W=210,M=18; let y=58;

  pdfHeader(doc,'INFORME DE INVENTARIO',`Generado el ${fd} a las ${fh}`,
    `Sin stock: ${sinStock}`,`Stock bajo: ${bajStock}`,W,M);

  const cats={};
  stockData.forEach(p=>{if(!cats[p.cat])cats[p.cat]=[];cats[p.cat].push(p);});

  Object.entries(cats).forEach(([cat,prods])=>{
    if(y>260){doc.addPage();y=20;}
    // Cabecera categoría — barra lateral de color + fondo
    doc.setFillColor(250,246,241); doc.roundedRect(M,y-6,W-M*2,11,2,2,'F');
    doc.setFillColor(139,58,30); doc.rect(M,y-6,3,11,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(100,40,15);
    doc.text(cat,M+7,y+1.5);
    // Nº artículos en la derecha
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(160,100,70);
    doc.text(`${prods.length} artículo${prods.length!==1?'s':''}`,W-M-2,y+1.5,{align:'right'});
    y+=14;

    // Cabecera columnas
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    doc.setTextColor(150,130,115);
    doc.setCharSpace(0.8);
    doc.text('ARTÍCULO',M+2,y); doc.text('ESTADO',W-M-50,y); doc.text('UNIADES',W-M-2,y,{align:'right'});
    doc.setCharSpace(0);
    y+=1.5;
    doc.setDrawColor(220,210,200); doc.line(M,y,W-M,y); y+=4.5;

    prods.forEach((p,i)=>{
      if(y>272){doc.addPage();y=20;}
      // Fila alterna
      if(i%2===0){doc.setFillColor(253,251,248);doc.rect(M,y-3.5,W-M*2,8,'F');}

      // Punto de color según estado
      let tc,pc;
      if(p.qty===0){tc=[170,40,40];pc=[220,80,80];}
      else if(p.qty<=2){tc=[160,80,20];pc=[220,140,40];}
      else{tc=[35,110,55];pc=[70,170,100];}
      doc.setFillColor(...pc); doc.circle(M+3,y,1.2,'F');

      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(28,26,23);
      doc.text(p.name,M+7,y+0.5);

      // Badge estado
      let bt;
      if(p.qty===0) bt='Sin stock';
      else if(p.qty<=2) bt='Stock bajo';
      else bt='Disponible';
      doc.setFillColor(...tc.map(v=>Math.min(255,v+180)));
      doc.roundedRect(W-M-52,y-3,28,5.5,1.5,1.5,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...tc);
      doc.text(bt,W-M-38,y+0.8,{align:'center'});

      // Número grande
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...tc);
      doc.text(String(p.qty),W-M-2,y+1,{align:'right'});
      y+=9;
    });
    y+=5;
  });

  pdfFooter(doc,`Decotara Stock  ·  Inventario ${fd}`,`${fd} ${fh}`,W,M);
  doc.save(`inventario-decotara-${now.toISOString().split('T')[0]}.pdf`);
  showAlert('PDF de inventario descargado.','ok');
}

function exportVentasPDF(){
  if(!salesData.length){showAlert('No hay ventas para exportar.','err');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const now=new Date();
  const fd=now.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fh=now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const totalUds=salesData.reduce((s,v)=>s+v.qty,0);
  const W=210,M=18; let y=58;

  pdfHeader(doc,'INFORME DE VENTAS',`Generado el ${fd} a las ${fh}`,
    `${salesData.length} ventas`,`${totalUds} unidades vendidas`,W,M);

  // Cabecera tabla
  doc.setFillColor(250,246,241); doc.roundedRect(M,y-5,W-M*2,10,2,2,'F');
  doc.setFillColor(139,58,30); doc.rect(M,y-5,3,10,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(100,40,15);
  doc.setCharSpace(0.8);
  doc.text('FECHA',M+7,y); doc.text('ALBARÁN',M+33,y);
  doc.text('CLIENTE',M+68,y); doc.text('ARTÍCULO',M+112,y);
  doc.text('UD.',W-M-2,y,{align:'right'});
  doc.setCharSpace(0);
  y+=5; doc.setDrawColor(220,210,200); doc.line(M,y,W-M,y); y+=5;

  function drawVentasHeader(){
    doc.setFillColor(250,246,241); doc.roundedRect(M,y-5,W-M*2,10,2,2,'F');
    doc.setFillColor(139,58,30); doc.rect(M,y-5,3,10,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(100,40,15);
    doc.setCharSpace(0.8);
    doc.text('FECHA',M+7,y); doc.text('ALBARÁN',M+33,y);
    doc.text('CLIENTE',M+68,y); doc.text('ARTÍCULO',M+112,y);
    doc.text('UD.',W-M-2,y,{align:'right'});
    doc.setCharSpace(0);
    y+=5; doc.setDrawColor(220,210,200); doc.line(M,y,W-M,y); y+=5;
  }

  salesData.forEach((s,i)=>{
    if(y>274){doc.addPage();y=20;drawVentasHeader();}
    if(i%2===0){doc.setFillColor(253,251,248);doc.rect(M,y-3.5,W-M*2,9,'F');}

    const d=s.date?s.date.split('-').reverse().join('/'):'';

    // Punto decorativo
    doc.setFillColor(139,58,30); doc.circle(M+3,y,1.2,'F');

    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(28,26,23);
    doc.text(d,M+7,y+0.5);

    // Albarán con fondo
    const albW=doc.getTextWidth(s.albaran)+6;
    doc.setFillColor(250,242,230);
    doc.roundedRect(M+30,y-3,albW,5.5,1.5,1.5,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(139,58,30);
    doc.text(s.albaran,M+33,y+0.8);

    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(28,26,23);
    const cl=s.client.length>18?s.client.substring(0,17)+'.':s.client;
    const pr=s.product.length>22?s.product.substring(0,21)+'.':s.product;
    doc.text(cl,M+68,y+0.5);
    doc.text(pr,M+112,y+0.5);

    // Cantidad con círculo
    doc.setFillColor(250,242,230);
    doc.circle(W-M-5,y,4,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(139,58,30);
    doc.text(String(s.qty),W-M-5,y+0.8,{align:'center'});

    y+=9.5;
  });

  pdfFooter(doc,`Decotara Stock  ·  Ventas ${fd}`,`${salesData.length} ventas · ${totalUds} uds.`,W,M);
  doc.save(`ventas-decotara-${now.toISOString().split('T')[0]}.pdf`);
  showAlert('PDF de ventas descargado.','ok');
}

function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sec-'+tab).classList.add('active');
}

function showAlert(msg,type){
  const el=document.getElementById('alert-box');
  el.textContent=msg;el.className='alert alert-'+(type==='err'?'err':'ok');
  el.style.display='block';clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.display='none',4000);
}

init();
</script>
